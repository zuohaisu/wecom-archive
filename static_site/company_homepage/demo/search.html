<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>全局搜索 Demo｜康冠时代企业微信会话存档</title>
  <link rel="icon" href="../brand/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/demo.css">
</head>
<body data-demo-page="search">
  <div class="demo-shell">
    <aside class="demo-sidebar" data-demo-nav></aside>
    <div class="demo-main">
      <header class="demo-topbar" data-demo-topbar></header>
      <div class="demo-notice" role="status"><span class="demo-notice-mark" aria-hidden="true">i</span><span><b>静态演示数据</b>：可在下方输入框本地筛选虚构消息；Demo 不会将关键词发送到服务器，也不会查询真实数据。</span></div>
      <main class="demo-page">
        <div class="demo-page-head">
          <div><div class="demo-kicker">审阅</div><h1>全局搜索</h1><p>通过关键词、人员、时间范围和消息类型组合定位会话；结果保留所属会话、发送人和上下文摘要。</p></div>
          <div class="demo-page-actions"><a class="demo-btn" href="conversations.html">返回审阅</a><button class="demo-btn demo-btn-primary" type="button" data-demo-noop>演示导出</button></div>
        </div>

        <section class="demo-card">
          <div class="demo-card-body">
            <div class="demo-toolbar">
              <input class="demo-input" id="demo-search-input" type="search" value="归档" autocomplete="off" aria-label="搜索演示消息" placeholder="搜索会话、联系人或消息内容…">
              <button class="demo-btn demo-btn-primary" type="button" data-demo-noop>搜索</button>
              <div class="demo-toolbar-side" id="demo-search-count" aria-live="polite"></div>
            </div>
            <div class="demo-toolbar" aria-label="演示筛选条件">
              <button class="demo-chip is-active" type="button" data-demo-chip>时间 · 近 90 天</button>
              <button class="demo-chip" type="button" data-demo-chip>员工 · 全部</button>
              <button class="demo-chip is-active" type="button" data-demo-chip>消息类型 · 文本</button>
              <button class="demo-chip" type="button" data-demo-chip>会话类型 · 全部</button>
              <button class="demo-chip" type="button" data-demo-chip>仅含附件</button>
            </div>
          </div>
          <div id="demo-search-results" aria-live="polite"></div>
          <footer class="demo-card-foot">演示结果仅用于展示信息结构；实际检索范围受租户、角色和授权范围控制。</footer>
        </section>

        <section class="demo-grid demo-grid-3" style="margin-top:16px" aria-label="搜索能力说明">
          <article class="demo-card"><div class="demo-card-body"><span class="demo-icon-box">词</span><h2 style="margin:13px 0 5px">关键词定位</h2><p class="demo-meta">查看命中内容并保留会话上下文线索。</p></div></article>
          <article class="demo-card"><div class="demo-card-body"><span class="demo-icon-box">筛</span><h2 style="margin:13px 0 5px">组合筛选</h2><p class="demo-meta">按人员、时间、会话和消息类型缩小范围。</p></div></article>
          <article class="demo-card"><div class="demo-card-body"><span class="demo-icon-box">审</span><h2 style="margin:13px 0 5px">审阅留痕</h2><p class="demo-meta">检索和后续查看行为可纳入审计记录。</p></div></article>
        </section>
      </main>
    </div>
  </div>
  <script src="assets/demo-data.js"></script>
  <script src="assets/demo-shell.js"></script>
</body>
</html>
