<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<title>Audit Log</title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.side-nav{width:var(--nav-w);flex-shrink:0;background:var(--color-surface-nav);border-right:1px solid var(--color-border-strong);display:flex;flex-direction:column;overflow:hidden}.side-nav-brand{display:flex;align-items:center;gap:9px;padding:18px 18px 16px}.side-nav-logo{border-radius:var(--radius-md)}.side-nav-title{font-size:14.5px;font-weight:var(--weight-bold)}.side-nav-scroll{flex:1;overflow-y:auto;padding:0 10px 10px}.side-nav-group{font-size:var(--text-2xs);color:var(--color-text-5);letter-spacing:.06em;padding:12px 8px 4px;font-weight:var(--weight-semibold);text-transform:uppercase}.side-nav-item{padding:7px 10px;border-radius:var(--radius-md);font-size:var(--text-md);color:var(--color-text-2);text-decoration:none;display:flex;align-items:center;gap:6px}.side-nav-item:hover{background:var(--color-surface-hover);text-decoration:none}.side-nav-item.active{background:var(--color-primary-soft);color:var(--color-primary-hover);font-weight:var(--weight-semibold)}.side-nav-disabled{color:var(--color-text-disabled);cursor:default}.side-nav-disabled em{font-style:normal;font-size:10px;color:var(--color-text-5);border:1px solid var(--color-border);border-radius:var(--radius-xs);padding:0 4px;margin-left:auto}.side-nav-user{border-top:1px solid var(--color-border-strong);padding:12px 16px;display:flex;flex-direction:column;gap:8px;font-size:var(--text-sm)}.side-nav-user-row{display:flex;gap:8px}.btn-lang,.btn-logout{height:28px;padding:0 11px;border:1px solid var(--color-border-strong);border-radius:var(--radius-md);background:var(--color-surface);color:var(--color-text-2);font:inherit;font-size:var(--text-xs);cursor:pointer}.lang-switch{position:relative}.lang-menu{position:absolute;bottom:100%;left:0;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-2);min-width:7rem;z-index:2}.lang-option{padding:.4rem .7rem;cursor:pointer;white-space:nowrap}.lang-option.active{color:var(--color-primary-hover);font-weight:var(--weight-semibold);background:var(--color-primary-soft)}.log-time{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-3);white-space:nowrap}.actor{display:flex;align-items:center;gap:8px;min-width:0}.object{font-family:var(--font-mono);font-size:var(--text-xs);color:var(--color-text-3);overflow-wrap:anywhere}.action{font-family:var(--font-mono);font-size:var(--text-xs)}.status{min-height:1.5em}.table-wrap{overflow:auto}.table{min-width:720px}.table td{overflow-wrap:anywhere}.mb-5{margin-bottom:var(--space-5)}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<main class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="nav.group.review">Review</span><span class="sep">/</span><span class="cur" data-i18n="audit.title">Audit Log</span></div></header>
  <div class="page">
    <div class="page-hd"><div><h1 data-i18n="audit.title">Audit Log</h1><p data-i18n="audit.description">Read-only record of administrative events.</p></div></div>
    <div class="alert alert-neutral mb-5"><span class="alert-ico">ℹ</span><span data-i18n="audit.readOnly">Audit records are append-only and cannot be edited or deleted.</span></div>
    <form class="toolbar" id="audit-filters">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="operator-filter" type="search" data-i18n-placeholder="audit.operatorPlaceholder" placeholder="Filter by operator" autocomplete="off"></div>
      <input class="input" id="from-filter" type="date" data-i18n-title="audit.from" title="From">
      <span class="muted" data-i18n="audit.to">To</span>
      <input class="input" id="to-filter" type="date" data-i18n-title="audit.to" title="To">
      <input class="input" id="action-filter" type="search" list="audit-actions" data-i18n-placeholder="audit.actionPlaceholder" placeholder="Action type" autocomplete="off">
      <datalist id="audit-actions"><option value="login"></option><option value="search"></option><option value="export"></option><option value="config.changed"></option></datalist>
      <button class="btn" type="submit" data-i18n="audit.applyFilters">Apply filters</button>
      <button class="btn btn-ghost" type="button" id="clear-filters" data-i18n="audit.clearFilters">Clear</button>
      <div class="right"><span class="muted" id="result-count"></span></div>
    </form>
    <div class="table-wrap">
      <table class="table table-fixed"><thead><tr><th data-i18n="audit.time">Time</th><th data-i18n="audit.operator">Operator</th><th data-i18n="audit.action">Action</th><th data-i18n="audit.event">Event</th><th data-i18n="audit.auditId">Audit ID</th></tr></thead><tbody id="audit-rows"><tr><td colspan="5" class="loading" data-i18n="audit.loading">Loading audit logs…</td></tr></tbody></table>
      <div class="card-ft"><div class="pagination"><span id="pagination-summary"></span><div class="pages"><button class="page-btn" id="previous-page" type="button">‹</button><span class="page-btn active" id="page-number">1</span><button class="page-btn" id="next-page" type="button">›</button></div></div></div>
    </div>
    <p class="status muted" id="audit-status" role="status"></p>
  </div>
</main>
</div>
<script>
(function(){
  'use strict';
  var limit=50,offset=0,total=0;
  var filters=document.getElementById('audit-filters'), rows=document.getElementById('audit-rows');
  function text(key){return I18N.t(key);}
  function applyI18n(){document.documentElement.lang=I18N.getLocale();document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=text(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=text(el.getAttribute('data-i18n-placeholder'));});document.querySelectorAll('[data-i18n-title]').forEach(function(el){el.title=text(el.getAttribute('data-i18n-title'));});document.title=text('audit.title');}
  function formatTime(value){var date=new Date(value);return isNaN(date.getTime())?value:date.toLocaleString(I18N.getLocale());}
  function addCell(row, value, className){var cell=document.createElement('td');if(className)cell.className=className;cell.textContent=value || '—';row.appendChild(cell);}
  function render(items){rows.textContent='';if(!items.length){var row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=5;cell.className='empty';cell.textContent=text('audit.empty');row.appendChild(cell);rows.appendChild(row);return;}items.forEach(function(item){var row=document.createElement('tr');addCell(row,formatTime(item.created_at),'log-time');addCell(row,item.actor_name || (item.admin_user_id ? item.admin_user_id : text('audit.system')),'');addCell(row,item.action,'action');addCell(row,item.object_type+(item.object_id ? ' · '+item.object_id : ''),'object');addCell(row,item.id,'cell-id');rows.appendChild(row);});}
  function params(){var p=new URLSearchParams({limit:String(limit),offset:String(offset)}),operator=document.getElementById('operator-filter').value.trim(),action=document.getElementById('action-filter').value.trim(),from=document.getElementById('from-filter').value,to=document.getElementById('to-filter').value;if(operator)p.set('q',operator);if(action)p.set('action',action);if(from)p.set('from',from+'T00:00:00');if(to)p.set('to',to+'T23:59:59.999');return p;}
  function updatePagination(){var page=Math.floor(offset/limit)+1,pages=Math.max(1,Math.ceil(total/limit));document.getElementById('result-count').textContent=text('audit.results').replace('{n}',total);document.getElementById('pagination-summary').textContent=text('audit.page').replace('{page}',page).replace('{pages}',pages);document.getElementById('page-number').textContent=page;document.getElementById('previous-page').disabled=offset===0;document.getElementById('next-page').disabled=offset+limit>=total;}
  function load(){rows.innerHTML='<tr><td colspan="5" class="loading">'+text('audit.loading')+'</td></tr>';document.getElementById('audit-status').textContent='';fetch('/api/admin/audit-logs?'+params().toString()).then(function(response){if(!response.ok)throw new Error(String(response.status));return response.json();}).then(function(data){total=data.total;limit=data.limit;offset=data.offset;render(data.items);updatePagination();}).catch(function(){rows.innerHTML='<tr><td colspan="5" class="empty">'+text('audit.failedToLoad')+'</td></tr>';document.getElementById('audit-status').textContent=text('audit.failedToLoad');});}
  filters.addEventListener('submit',function(event){event.preventDefault();offset=0;load();});document.getElementById('clear-filters').addEventListener('click',function(){filters.reset();offset=0;load();});document.getElementById('previous-page').addEventListener('click',function(){if(offset){offset=Math.max(0,offset-limit);load();}});document.getElementById('next-page').addEventListener('click',function(){if(offset+limit<total){offset+=limit;load();}});
  function renderLangMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.textContent='';I18N.availableLocales().forEach(function(locale){var option=document.createElement('div');option.className='lang-option'+(locale.code===I18N.getLocale()?' active':'');option.textContent=locale.nativeName;option.onclick=function(){I18N.setLocale(locale.code);menu.style.display='none';applyI18n();load();};menu.appendChild(option);});}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');if(!menu)return;renderLangMenu();menu.style.display=menu.style.display==='block'?'none':'block';};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST'}).finally(function(){window.location.href='/admin/login';});};
  applyI18n();load();
}());
</script>
</body>
</html>
