<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索 — 平台运营控制台</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.search-hero{max-width:640px;margin:0 auto var(--space-6);text-align:center}
.search-hero h1{font-size:var(--text-2xl);font-weight:var(--weight-semibold);margin-bottom:var(--space-2)}
.search-hero p{color:var(--color-text-3);font-size:var(--text-sm)}
.search-input{position:relative;max-width:560px;margin:var(--space-5) auto 0}
.search-input .ico{position:absolute;left:.7rem;top:50%;transform:translateY(-50%);color:var(--color-text-4);pointer-events:none}
.search-input input{width:100%;height:40px;padding:0 1rem;font-size:var(--text-md)}
.results-meta{color:var(--color-text-4);font-size:var(--text-sm);margin:var(--space-4) 0 var(--space-2)}
.result-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);padding:var(--space-4);cursor:pointer;transition:border-color .15s}
.result-card:hover{border-color:var(--color-primary)}
.result-card .name{font-weight:var(--weight-semibold)}
.result-card .meta{color:var(--color-text-4);font-size:var(--text-xs);margin-top:2px}
.result-empty{padding:var(--space-8) var(--space-4);text-align:center;color:var(--color-text-4)}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
<header class="topbar">
  <div class="breadcrumb"><span>平台运营</span><span class="sep">/</span><span class="cur">搜索</span></div>
  <div class="topbar-actions"><span class="tz-note" id="platform-last-refresh"></span>
  <button class="btn btn-sm" type="button" id="platform-refresh">刷新数据</button></div>
</header>
<main class="page">
  <div class="search-hero">
    <h1>搜索</h1>
    <p>按租户名称 / slug / corp_id 查找租户，点击结果进入详情。</p>
    <div class="search-input"><span class="ico">⌕</span>
      <input class="input" id="search-input" type="search" placeholder="搜索租户名称 / slug / corp_id" autocomplete="off">
    </div>
  </div>
  <div class="results-meta" id="results-meta" hidden></div>
  <div id="results-list"></div>
</main>
</div></div>
<script src="/web/static/platform-search.js?v=__STATIC_VERSION__"></script>
</body>
</html>
