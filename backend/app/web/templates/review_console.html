<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Conversation Review Console</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="apple-touch-icon" href="/api/branding/favicon">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/console/media-viewer.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bubble-self-bg:#cfe6fd;--bubble-self-text:#000;--bubble-other-bg:#fff;--bubble-other-text:#000;--link-color:#417ce8}
body{font-family:system-ui,sans-serif;color:var(--color-text);background:var(--color-canvas);height:100vh;overflow:hidden}
a{color:var(--link-color)}
/* ------------------------------------------------------------------ */
/* Console main column                                                 */
/* ------------------------------------------------------------------ */
.console-main{flex:1;min-width:0;display:flex;flex-direction:column;overflow:hidden}
.layout{display:flex;flex:1;overflow:hidden}
.loading{padding:1rem;text-align:center;color:#bbb;font-size:.82rem}
/* ------------------------------------------------------------------ */
/* Left column: monitoring-scope popover + conv-type tabs + conv list   */
/* ------------------------------------------------------------------ */
.col-conv{width:328px;flex-shrink:0;border-right:1px solid var(--color-border);position:relative}
.badge{display:inline-block;font-size:.7rem;padding:.05rem .3rem;border-radius:2px;font-weight:var(--weight-medium);line-height:1.4}
.btn-danger{border-color:#ffa39e;color:var(--color-danger-fg);background:#fff1f0}
@media (prefers-reduced-motion: reduce){[data-msgid].target-flash{animation:none}}
/* ------------------------------------------------------------------ */
/* Right column: 会话信息 / 消息详情 panel                               */
/* ------------------------------------------------------------------ */
.col-panel{width:300px;flex-shrink:0;border-left:1px solid var(--color-border)}
/* QA fix: side-nav (212px) + col-conv (328px) + col-panel (300px) are all
   fixed-width with no breakpoint, so at common laptop widths (~1024-1366px)
   the timeline -- the one flexible column -- was squeezed down to as
   little as ~184px. Shrink the three fixed columns at narrower viewports
   instead of hiding any of them outright (hiding the panel would fight the
   user's own 详情面板 toggle state). */
@media (max-width: 1300px){
  .col-conv{width:260px}
  .col-panel{width:260px}
}
@media (max-width: 900px){
  .delete-bar{flex-wrap:wrap;padding:8px 12px}
}

</style>
</head>
<body>
__I18N_SCRIPT__
<script>var RND216_MTR_ENTRIES = __MTR_ENTRIES_JSON__;</script>
<script>var RND216_MSGTYPE_OPTIONS = __MSGTYPE_OPTIONS_JSON__;</script>
<div class="shell">

__SIDENAV__

<div class="console-main">
  <div class="top-bar">
    <span class="tz-note" data-i18n="console.tzNote">时间均为北京时间 (UTC+8)</span>
    <div class="search-bar" id="search-bar">
      <input type="text" id="search-input" placeholder="搜索联系人或聊天内容…" autocomplete="off">
      <span class="enter-hint" data-i18n="search.enterHintShort">↵ 结果页</span>
    </div>
    <div class="top-bar-actions">
      <span id="sync-status" class="sync-status" aria-live="polite"></span>
      <button type="button" class="btn-toggle" id="btn-export-conversation" onclick="openConversationExport()" data-i18n="exports.openConversation" disabled>导出当前会话</button>
      <button class="btn-sync-now" id="btn-sync-now" onclick="syncNow()" data-i18n="sync.now">立即同步</button>
      <button type="button" class="btn-toggle" id="btn-audit-mode" onclick="toggleAuditMode()" data-i18n="console.auditMode">审阅模式</button>
      <button type="button" class="btn-toggle active" id="btn-panel-toggle" onclick="togglePanel()" data-i18n="console.detailPanel">详情面板</button>
    </div>
  </div>

  <div class="layout">

    <div class="col col-conv">
      <div class="scope-bar">
        <button type="button" class="scope-btn" id="scope-btn" onclick="toggleScopePopover()">
          <span class="scope-avatar" id="scope-avatar">?</span>
          <!-- QA fix: no data-i18n here on purpose -- once an entity is
               selected, updateScopeButton() owns this element's text
               ("监控账号：Alice"). A data-i18n attribute would make every
               applyStaticI18n() call (any locale switch) stomp that back
               to the generic placeholder below. applyLocale() refreshes
               this element explicitly instead (updateScopeButton() when
               an entity is selected, the placeholder text otherwise). -->
          <span class="scope-label" id="scope-label">请选择员工或外部联系人查看会话</span>
          <span class="scope-caret">▾</span>
        </button>
        <div class="scope-popover" id="scope-popover" style="display:none">
          <div class="mode-tabs">
            <button class="mode-tab active" id="tab-staff" onclick="selectModeWithTracking('staff')" data-i18n="nav.staff">员工</button>
            <button class="mode-tab" id="tab-contact" onclick="selectModeWithTracking('contact')" data-i18n="nav.contact">联系人</button>
          </div>
          <div class="col-header" id="entity-header" data-i18n="console.monitoredAccounts">存档员工</div>
          <div class="scope-popover-body" id="entity-body"><div class="loading" data-i18n="console.loading">加载中…</div></div>
        </div>
      </div>
      <div class="conv-type-tabs" id="conv-type-tabs">
        <button type="button" class="ctab active" data-type="all" onclick="setConvTypeFilter('all')" data-i18n="console.convTypeAll">全部</button>
        <button type="button" class="ctab" data-type="group" onclick="setConvTypeFilter('group')" data-i18n="convList.groupBadge">群聊</button>
        <button type="button" class="ctab" data-type="direct" onclick="setConvTypeFilter('direct')" data-i18n="convList.directBadge">单聊</button>
      </div>
      <div class="col-header" id="conv-header" data-i18n="nav.conversations">会话</div>
      <div class="col-body" id="conv-body"><div class="empty-state" data-i18n="console.selectAccountOrContact">请选择员工或外部联系人查看会话</div></div>
      <div class="search-filters" id="search-filters" style="display:none"></div>
      <div class="search-results" id="search-results" style="display:none"></div>
    </div>

    <div class="col col-timeline">
      <div class="timeline-header-bar">
        <div class="timeline-title" id="timeline-header" data-i18n="console.timelineHeader">消息时间线</div>
      </div>
      <!-- RND-363: delete-selection action bar (visible only in delete mode). -->
      <div class="delete-bar" id="delete-bar" role="toolbar" aria-label="删除模式" hidden>
        <span class="delete-selected-count" id="delete-selected-count">已选择 0 条</span>
        <button type="button" class="btn-toggle" id="btn-delete-select-all" onclick="toggleSelectAllLoaded()">全选已加载</button>
        <span class="delete-bar-spacer"></span>
        <button type="button" class="btn-toggle btn-danger" id="btn-delete-confirm" onclick="confirmDeleteSelected()" disabled>删除所选</button>
        <button type="button" class="btn-toggle" onclick="toggleDeleteMode()" data-i18n="delete.exit">退出选择</button>
      </div>
      <div class="delete-result" id="delete-result" hidden></div>
      <a class="delete-result-recycle" id="delete-result-recycle" href="/admin/recycle-bin" hidden data-i18n="delete.result.recycle">进入回收站</a>
      <div class="locator-bar" id="locator-bar" style="display:none">
        <span class="locator-text" id="locator-text"></span>
        <div class="locator-actions">
          <button type="button" class="locator-btn" onclick="locatorPrev()" data-i18n="locator.prev">‹ 上一条</button>
          <button type="button" class="locator-btn" onclick="locatorNext()" data-i18n="locator.next">下一条 ›</button>
          <button type="button" class="locator-dismiss" onclick="clearLocator()" data-i18n="locator.dismiss">收起</button>
        </div>
      </div>
      <div class="col-body" id="timeline-body"><div class="empty-state" data-i18n="console.selectConversation">请选择会话</div></div>
      <button class="new-msg-indicator" id="new-msg-indicator" style="display:none" onclick="scrollTimelineToBottom()"><span data-i18n="refresh.newMessages">有新消息</span> ↓</button>
      <div class="timeline-footer" data-i18n="console.readOnlyNote">归档只读 · 不可发送消息</div>
    </div>

    <div class="col col-panel" id="panel-col">
      <div class="panel-tabs">
        <button type="button" class="panel-tab active" id="panel-tab-info" onclick="setPanelTab('info')" data-i18n="panel.info">会话信息</button>
        <button type="button" class="panel-tab" id="panel-tab-audit" onclick="setPanelTab('audit')" data-i18n="panel.audit">消息详情</button>
      </div>
      <div class="col-body" id="panel-info-body"><div class="empty-state" data-i18n="console.selectConversation">请选择会话</div></div>
      <div class="col-body" id="panel-audit-body" style="display:none"><div class="empty-state" data-i18n="panel.noSelection">点击任意消息查看审计元数据</div></div>
    </div>

  </div>
</div>
</div>

<!-- RND-363: delete confirmation modal (custom, i18n'd, focusable). -->
<div class="delete-modal" id="delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title" hidden>
  <div class="delete-modal-backdrop" onclick="document.getElementById('delete-confirm-modal').hidden=true"></div>
  <div class="delete-modal-card" role="document">
    <div class="delete-modal-hd">
      <h3 id="delete-confirm-title" data-i18n="delete.confirmTitle">删除消息</h3>
      <button type="button" class="delete-modal-close" id="btn-delete-confirm-close" aria-label="关闭" onclick="document.getElementById('delete-confirm-modal').hidden=true">×</button>
    </div>
    <div class="delete-modal-bd">
      <p class="delete-confirm-count" id="delete-confirm-count"></p>
      <ul class="delete-confirm-list">
        <li data-i18n="delete.confirmRecycle">删除后消息进入回收站，30 天内可恢复。</li>
        <li data-i18n="delete.confirmPurge">30 天后自动永久清理，无法恢复。</li>
        <li data-i18n="delete.confirmScope">仅删除本系统存档副本，不影响企业微信原始记录。</li>
      </ul>
    </div>
    <div class="delete-modal-actions">
      <button type="button" class="btn-toggle" id="btn-delete-confirm-cancel" data-i18n="delete.cancel">取消</button>
      <button type="button" class="btn-toggle btn-danger" id="btn-delete-confirm-ok" data-i18n="delete.confirmAction">确认删除</button>
    </div>
  </div>
</div>

<script src="/web/static/product-analytics.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/console-state.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/api-client.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/avatar.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/conversation-list.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/timeline.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/delete-timeline.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/message-renderers.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/media-viewer.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/refresh.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/console-entry.js?v=__STATIC_VERSION__"></script>
</body>
</html>
