<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>用户管理</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.user-cell{display:flex;align-items:center;gap:10px;min-width:0}.last-active{display:flex;flex-direction:column;gap:1px}.hidden{display:none!important}.status-message{min-height:1.3em}.role-select{width:100%}@media(max-width:900px){.side-nav{display:none}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:var(--space-4)}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><span data-i18n="users.breadcrumbDirectory">通讯录</span><span class="sep">/</span><span class="cur" data-i18n="users.pageTitle">用户管理</span></div>
    <div class="topbar-actions"><button class="btn btn-primary hidden" type="button" id="invite-open" data-i18n="users.invite">邀请管理员</button></div>
  </header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="users.pageTitle">用户管理</h1><p data-i18n="users.description">管理控制台账号的角色、状态和活跃情况。</p></div></div>
    <div class="grid grid-4 mb-5">
      <div class="stat"><span class="stat-k" data-i18n="users.total">控制台账号</span><span class="stat-v tnum" id="total-users">—</span></div>
      <div class="stat"><span class="stat-k" data-i18n="users.active">已启用</span><span class="stat-v tnum" id="active-users">—</span></div>
      <div class="stat"><span class="stat-k" data-i18n="users.disabled">已停用</span><span class="stat-v tnum" id="disabled-users">—</span></div>
      <div class="stat"><span class="stat-k" data-i18n="users.silent30">静默 ≥30 天</span><span class="stat-v tnum" id="silent-users">—</span></div>
    </div>
    <!-- RND-321: kept structurally and visually separate from the users
         table below — a pending request is not a user (no role, no
         session, no login history) and must never be presented as one
         (AC-5). Hidden entirely for non owner/admin roles, not just its
         actions — the section itself, including email hints, is not for
         ordinary roles to see. -->
    <section class="card mb-5 hidden" id="access-requests-section" aria-labelledby="access-requests-title">
      <div class="card-hd"><h2 id="access-requests-title" data-i18n="users.accessRequests.title">待处理访问申请</h2><p class="field-help" data-i18n="users.accessRequests.description">已通过企业微信身份验证、但尚未关联控制台账号的员工。关联或创建账号前不会发放任何登录权限。</p></div>
      <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="users.accessRequests.employee">员工</th><th data-i18n="users.accessRequests.emailHint">邮箱线索</th><th data-i18n="users.accessRequests.requestedAt">申请时间</th><th class="actions" data-i18n="users.accessRequests.actions">操作</th></tr></thead><tbody id="access-requests-body"><tr><td colspan="4" class="loading" data-i18n="users.accessRequests.loading">正在加载访问申请…</td></tr></tbody></table></div>
    </section>
    <div class="toolbar toolbar-compact">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="user-search" type="search" data-i18n-placeholder="users.searchPlaceholder" placeholder="搜索姓名、账号或部门"></div>
      <select class="select" id="role-filter"><option value="" data-i18n="users.allRoles">全部角色</option><option value="owner" data-i18n="users.role.owner">所有者</option><option value="admin" data-i18n="users.role.admin">管理员</option><option value="compliance" data-i18n="users.role.compliance">合规</option><option value="legal" data-i18n="users.role.legal">法务</option><option value="readonlyaudit" data-i18n="users.role.readonlyaudit">只读审计</option></select>
      <select class="select" id="status-filter"><option value="" data-i18n="users.allStatuses">全部状态</option><option value="active" data-i18n="users.active">已启用</option><option value="disabled" data-i18n="users.disabled">已停用</option></select>
    </div>
    <p id="users-status" class="field-help status-message" role="status" aria-live="polite"></p>
    <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="users.user">用户 / 账号</th><th data-i18n="users.department">部门</th><th data-i18n="users.role">角色</th><th data-i18n="users.status">状态</th><th data-i18n="users.lastActive">最后活跃</th><th class="num" data-i18n="users.messages30">近 30 天消息</th><th class="actions" data-i18n="users.actions">操作</th></tr></thead><tbody id="users-body"><tr><td colspan="7" class="loading" data-i18n="users.loading">正在加载用户…</td></tr></tbody></table><div class="card-ft"><div class="pagination" id="pagination"></div></div></div>
  </main>
</div></div>
<div class="modal-backdrop hidden" id="invite-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="invite-title"><div class="modal-hd"><h2 id="invite-title" data-i18n="users.invite">邀请管理员</h2><button class="modal-close" type="button" data-close-invite aria-label="Close">×</button></div><form id="invite-form"><div class="modal-bd"><div class="field"><label class="field-label" for="invite-name" data-i18n="users.name">姓名</label><input class="input" id="invite-name" type="text"></div><div class="field"><label class="field-label" for="invite-email"><span data-i18n="users.email">企业邮箱</span><span class="req">*</span></label><input class="input" id="invite-email" type="email" required autocomplete="email"></div><div class="field"><label class="field-label" for="invite-role" data-i18n="users.role">角色</label><select class="select role-select" id="invite-role"><option value="admin" data-i18n="users.role.admin">管理员</option><option value="owner" data-i18n="users.role.owner">所有者</option><option value="compliance" data-i18n="users.role.compliance">合规</option><option value="legal" data-i18n="users.role.legal">法务</option><option value="readonlyaudit" data-i18n="users.role.readonlyaudit">只读审计</option></select></div><p id="invite-status" class="field-help status-message" role="status"></p></div><div class="modal-ft"><button class="btn" type="button" data-close-invite data-i18n="users.cancel">取消</button><button class="btn btn-primary" id="invite-submit" type="submit" data-i18n="users.sendInvite">发送邀请</button></div></form></div></div>
<div class="modal-backdrop hidden" id="role-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="role-title"><div class="modal-hd"><h2 id="role-title" data-i18n="users.changeRoleTitle">修改用户权限</h2><button class="modal-close" type="button" data-close-role aria-label="Close">×</button></div><form id="role-form"><div class="modal-bd"><input id="role-user-id" type="hidden"><p id="role-user-name" class="field-help"></p><div class="field"><label class="field-label" for="role-select" data-i18n="users.role">角色</label><select class="select role-select" id="role-select"><option value="owner" data-i18n="users.role.owner">所有者</option><option value="admin" data-i18n="users.role.admin">管理员</option><option value="compliance" data-i18n="users.role.compliance">合规</option><option value="legal" data-i18n="users.role.legal">法务</option><option value="readonlyaudit" data-i18n="users.role.readonlyaudit">只读审计</option></select></div><p id="role-status" class="field-help status-message" role="status"></p></div><div class="modal-ft"><button class="btn" type="button" data-close-role data-i18n="users.cancel">取消</button><button class="btn btn-primary" id="role-submit" type="submit" data-i18n="users.saveRole">保存权限</button></div></form></div></div>
<div class="modal-backdrop hidden" id="link-request-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="link-request-title"><div class="modal-hd"><h2 id="link-request-title" data-i18n="users.accessRequests.linkModalTitle">关联访问申请到已有账号</h2><button class="modal-close" type="button" data-close-link-request aria-label="Close">×</button></div><form id="link-request-form"><div class="modal-bd"><input id="link-request-id" type="hidden"><div class="field"><label class="field-label" for="link-request-account" data-i18n="users.accessRequests.selectAccount">目标账号</label><select class="select" id="link-request-account" required><option value="" data-i18n="users.accessRequests.selectAccountPlaceholder">请选择账号…</option></select></div><p id="link-request-status" class="field-help status-message" role="status"></p></div><div class="modal-ft"><button class="btn" type="button" data-close-link-request data-i18n="users.cancel">取消</button><button class="btn btn-primary" id="link-request-submit" type="submit" data-i18n="users.accessRequests.linkSubmit">确认关联</button></div></form></div></div>
<div class="modal-backdrop hidden" id="create-request-modal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="create-request-title"><div class="modal-hd"><h2 id="create-request-title" data-i18n="users.accessRequests.createModalTitle">从访问申请创建新账号</h2><button class="modal-close" type="button" data-close-create-request aria-label="Close">×</button></div><form id="create-request-form"><div class="modal-bd"><input id="create-request-id" type="hidden"><div class="field"><label class="field-label" for="create-request-name" data-i18n="users.accessRequests.accountName">账号姓名</label><input class="input" id="create-request-name" type="text"></div><div class="field"><label class="field-label" for="create-request-role" data-i18n="users.role">角色</label><select class="select role-select" id="create-request-role"><option value="admin" data-i18n="users.role.admin">管理员</option><option value="owner" data-i18n="users.role.owner">所有者</option><option value="compliance" data-i18n="users.role.compliance">合规</option><option value="legal" data-i18n="users.role.legal">法务</option><option value="readonlyaudit" data-i18n="users.role.readonlyaudit">只读审计</option></select></div><div class="field"><label class="field-label" for="create-request-status" data-i18n="users.accessRequests.initialStatus">初始状态</label><select class="select" id="create-request-status"><option value="active" data-i18n="users.active">已启用</option><option value="disabled" data-i18n="users.disabled">已停用</option></select></div><p id="create-request-status-msg" class="field-help status-message" role="status"></p></div><div class="modal-ft"><button class="btn" type="button" data-close-create-request data-i18n="users.cancel">取消</button><button class="btn btn-primary" id="create-request-submit" type="submit" data-i18n="users.accessRequests.createSubmit">创建并关联</button></div></form></div></div>
<script>
(function () {
  var state={page:1,perPage:20,total:0,canManageUsers:false,currentRole:null,currentUserId:null};
  function translate(){document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=I18N.t(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=I18N.t(el.getAttribute('data-i18n-placeholder'));});document.title=I18N.t('users.pageTitle');}
  function escapeHtml(value){var div=document.createElement('div');div.textContent=value == null ? '' : String(value);return div.innerHTML;}
  function apiError(response){return response.json().catch(function(){return {};}).then(function(body){return body.detail || I18N.t('users.requestFailed');});}
  function postAccessRequestAction(url,body,statusEl){return fetch(url,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(function(response){if(response.ok)return response.json();return response.json().catch(function(){return {};}).then(function(parsed){if(response.status===409&&parsed&&parsed.detail&&parsed.detail.error==='legacy_identity_conflict'){var conflictName=(parsed.detail.conflicting_account&&parsed.detail.conflicting_account.name)||'';var confirmMsg=I18N.t('users.accessRequests.legacyConflictConfirm').replace('{name}',conflictName);if(window.confirm(confirmMsg)){return postAccessRequestAction(url,Object.assign({},body,{release_conflicting_legacy_account:true}),statusEl);}return Promise.reject(I18N.t('users.accessRequests.legacyConflictCancelled'));}var message=parsed&&parsed.detail;return Promise.reject(typeof message==='string'?message:I18N.t('users.requestFailed'));});});}
  function formatDate(value){if(!value)return I18N.t('users.never');var date=new Date(value);return isNaN(date) ? value : date.toLocaleString(I18N.getLocale());}
  function roleLabel(role){return I18N.t('users.role.'+role);}
  function setStatus(text,error){var el=document.getElementById('users-status');el.textContent=text;el.className=error?'field-error status-message':'field-help status-message';}
  function canManage(user){return state.canManageUsers&&user.id!==state.currentUserId&&(state.currentRole==='owner'||user.role!=='owner');}
  function render(items){var body=document.getElementById('users-body');if(!items.length){body.innerHTML='<tr><td colspan="7" class="empty">'+escapeHtml(I18N.t('users.empty'))+'</td></tr>';return;}body.innerHTML=items.map(function(user){var action=user.status==='active'?'disabled':'active';var actionKey=action==='disabled'?'users.disable':'users.enable';var manageable=canManage(user);var roleAction=manageable?'<button class="btn-link" data-action="role" data-id="'+escapeHtml(user.id)+'" data-name="'+escapeHtml(user.name||user.wecom_user_id||'')+'" data-role="'+escapeHtml(user.role)+'">'+escapeHtml(I18N.t('users.changeRole'))+'</button>':'';var lifecycleActions=manageable?'<button class="btn-link" data-action="status" data-id="'+escapeHtml(user.id)+'" data-status="'+action+'">'+escapeHtml(I18N.t(actionKey))+'</button><button class="btn-link" data-action="reset" data-id="'+escapeHtml(user.id)+'">'+escapeHtml(I18N.t('users.resetPassword'))+'</button>':'';return '<tr><td><div class="user-cell"><span class="avatar avatar-sm">'+escapeHtml((user.name||user.wecom_user_id||'?').slice(0,1))+'</span><div><div class="cell-primary">'+escapeHtml(user.name||I18N.t('users.unnamed'))+'</div><div class="cell-id">'+escapeHtml(user.wecom_user_id||user.email||'')+'</div></div></div></td><td>'+escapeHtml(user.department||'—')+'</td><td><span class="badge badge-plain">'+escapeHtml(roleLabel(user.role))+'</span>'+roleAction+'</td><td><span class="badge '+(user.status==='active'?'badge-success':'')+'">'+escapeHtml(I18N.t('users.'+user.status))+'</span></td><td><div class="last-active">'+escapeHtml(formatDate(user.last_active_at))+'</div></td><td class="num">'+Number(user.msg_count_30d||0).toLocaleString()+'</td><td class="actions">'+lifecycleActions+'</td></tr>';}).join('');}
  function renderPagination(){var pages=Math.max(1,Math.ceil(state.total/state.perPage)), el=document.getElementById('pagination');el.innerHTML='<span>'+escapeHtml(I18N.t('users.total'))+': '+state.total+'</span><div class="pages"><button class="page-btn" data-page="'+(state.page-1)+'" '+(state.page===1?'disabled':'')+'>‹</button><span class="page-btn active">'+state.page+'</span><button class="page-btn" data-page="'+(state.page+1)+'" '+(state.page>=pages?'disabled':'')+'>›</button></div>';}
  function load(){setStatus('');var params=new URLSearchParams({page:state.page,per_page:state.perPage});var q=document.getElementById('user-search').value.trim(),role=document.getElementById('role-filter').value,status=document.getElementById('status-filter').value;if(q)params.set('q',q);if(role)params.set('role',role);if(status)params.set('status',status);fetch('/api/admin/users?'+params,{credentials:'include'}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));return response.json();}).then(function(data){state.total=data.total;render(data.items);renderPagination();var active=data.items.filter(function(u){return u.status==='active';}).length,disabled=data.items.filter(function(u){return u.status==='disabled';}).length,silent=data.items.filter(function(u){return u.last_active_at && Date.now()-new Date(u.last_active_at).getTime()>=2592000000;}).length;document.getElementById('total-users').textContent=data.total;document.getElementById('active-users').textContent=active;document.getElementById('disabled-users').textContent=disabled;document.getElementById('silent-users').textContent=silent;}).catch(function(message){setStatus(message || I18N.t('users.requestFailed'),true);});}
  function action(event){var button=event.target.closest('[data-action]');if(!button)return;var id=button.getAttribute('data-id');if(button.dataset.action==='role'){openRole(id,button.getAttribute('data-name'),button.getAttribute('data-role'));return;}if(button.dataset.action==='status'){if(!window.confirm(I18N.t(button.dataset.status==='disabled'?'users.confirmDisable':'users.confirmEnable')))return;fetch('/api/admin/users/'+encodeURIComponent(id),{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({status:button.dataset.status})}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));load();}).catch(function(message){setStatus(message,true);});return;}if(!window.confirm(I18N.t('users.confirmReset')))return;fetch('/api/admin/users/'+encodeURIComponent(id)+'/reset-password',{method:'POST',credentials:'include'}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));setStatus(I18N.t('users.resetSent'));}).catch(function(message){setStatus(message,true);});}
  function closeInvite(){document.getElementById('invite-modal').classList.add('hidden');}function openInvite(){document.getElementById('invite-modal').classList.remove('hidden');}
  function closeRole(){document.getElementById('role-modal').classList.add('hidden');}function openRole(id,name,role){document.getElementById('role-user-id').value=id;document.getElementById('role-user-name').textContent=name;document.getElementById('role-select').value=role;document.getElementById('role-status').textContent='';document.getElementById('role-modal').classList.remove('hidden');}
  function renderAccessRequests(items){var body=document.getElementById('access-requests-body');if(!items.length){body.innerHTML='<tr><td colspan="4" class="empty">'+escapeHtml(I18N.t('users.accessRequests.empty'))+'</td></tr>';return;}body.innerHTML=items.map(function(request){var match='';if(request.suspected_match_status==='multiple'){match='<div class="field-help">'+escapeHtml(I18N.t('users.accessRequests.suspectedMatchMultiple'))+'</div>';}else if(request.suspected_match){match='<div class="field-help">'+escapeHtml(I18N.t('users.accessRequests.suspectedMatch').replace('{name}',request.suspected_match.name||request.suspected_match.id))+'</div>';}var email=request.email_hint?escapeHtml(request.email_hint):escapeHtml(I18N.t('users.accessRequests.noEmailHint'));return '<tr><td><div class="cell-primary">'+escapeHtml(request.display_name||I18N.t('users.unnamed'))+'</div></td><td>'+email+match+'</td><td>'+escapeHtml(formatDate(request.created_at))+'</td><td class="actions"><button class="btn-link" data-request-action="link" data-request-id="'+escapeHtml(request.id)+'">'+escapeHtml(I18N.t('users.accessRequests.linkAction'))+'</button><button class="btn-link" data-request-action="create" data-request-id="'+escapeHtml(request.id)+'" data-request-name="'+escapeHtml(request.display_name||'')+'">'+escapeHtml(I18N.t('users.accessRequests.createAction'))+'</button></td></tr>';}).join('');}
  function loadAccessRequests(){if(!state.canManageUsers)return;fetch('/api/admin/access-requests',{credentials:'include'}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));return response.json();}).then(function(data){renderAccessRequests(data.items);}).catch(function(){document.getElementById('access-requests-body').innerHTML='<tr><td colspan="4" class="empty">'+escapeHtml(I18N.t('users.requestFailed'))+'</td></tr>';});}
  function closeLinkRequest(){document.getElementById('link-request-modal').classList.add('hidden');}
  function openLinkRequest(requestId){document.getElementById('link-request-id').value=requestId;var select=document.getElementById('link-request-account');select.innerHTML='<option value="" data-i18n="users.accessRequests.selectAccountPlaceholder">'+escapeHtml(I18N.t('users.accessRequests.selectAccountPlaceholder'))+'</option>';document.getElementById('link-request-status').textContent='';fetch('/api/admin/users?per_page=100',{credentials:'include'}).then(function(response){return response.ok?response.json():{items:[]};}).then(function(data){(data.items||[]).forEach(function(user){if(user.role==='owner'&&state.currentRole!=='owner')return;var option=document.createElement('option');option.value=user.id;option.textContent=(user.name||user.wecom_user_id||user.id)+' — '+roleLabel(user.role)+' ('+I18N.t('users.'+user.status)+')';select.appendChild(option);});});document.getElementById('link-request-modal').classList.remove('hidden');}
  function closeCreateRequest(){document.getElementById('create-request-modal').classList.add('hidden');}
  function openCreateRequest(requestId,name){document.getElementById('create-request-id').value=requestId;document.getElementById('create-request-name').value=name||'';document.getElementById('create-request-role').value='admin';document.getElementById('create-request-status').value='active';document.getElementById('create-request-status-msg').textContent='';document.getElementById('create-request-modal').classList.remove('hidden');}
  function accessRequestAction(event){var button=event.target.closest('[data-request-action]');if(!button)return;var id=button.getAttribute('data-request-id');if(button.dataset.requestAction==='link'){openLinkRequest(id);}else{openCreateRequest(id,button.getAttribute('data-request-name'));}}
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.getElementById('invite-open').addEventListener('click',openInvite);document.querySelectorAll('[data-close-invite]').forEach(function(el){el.addEventListener('click',closeInvite);});document.querySelectorAll('[data-close-role]').forEach(function(el){el.addEventListener('click',closeRole);});document.getElementById('invite-form').addEventListener('submit',function(event){event.preventDefault();var button=document.getElementById('invite-submit'),status=document.getElementById('invite-status');button.disabled=true;fetch('/api/admin/users/invite',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:document.getElementById('invite-name').value.trim()||null,email:document.getElementById('invite-email').value.trim(),role:document.getElementById('invite-role').value})}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));status.textContent=I18N.t('users.inviteSent');document.getElementById('invite-form').reset();load();}).catch(function(message){status.textContent=message;status.className='field-error status-message';}).finally(function(){button.disabled=false;});});document.getElementById('role-form').addEventListener('submit',function(event){event.preventDefault();if(!window.confirm(I18N.t('users.confirmRoleChange')))return;var button=document.getElementById('role-submit'),status=document.getElementById('role-status'),id=document.getElementById('role-user-id').value;button.disabled=true;fetch('/api/admin/users/'+encodeURIComponent(id)+'/role',{method:'PATCH',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:document.getElementById('role-select').value})}).then(function(response){if(!response.ok)return apiError(response).then(Promise.reject.bind(Promise));status.textContent=I18N.t('users.roleUpdated');load();}).catch(function(message){status.textContent=message;status.className='field-error status-message';}).finally(function(){button.disabled=false;});});
  document.getElementById('users-body').addEventListener('click',action);document.getElementById('pagination').addEventListener('click',function(event){var page=Number(event.target.dataset.page);if(page){state.page=page;load();}});['role-filter','status-filter'].forEach(function(id){document.getElementById(id).addEventListener('change',function(){state.page=1;load();});});document.getElementById('user-search').addEventListener('search',function(){state.page=1;load();});
  document.getElementById('access-requests-body').addEventListener('click',accessRequestAction);document.querySelectorAll('[data-close-link-request]').forEach(function(el){el.addEventListener('click',closeLinkRequest);});document.querySelectorAll('[data-close-create-request]').forEach(function(el){el.addEventListener('click',closeCreateRequest);});
  document.getElementById('link-request-form').addEventListener('submit',function(event){event.preventDefault();if(!window.confirm(I18N.t('users.accessRequests.confirmLink')))return;var button=document.getElementById('link-request-submit'),status=document.getElementById('link-request-status'),id=document.getElementById('link-request-id').value,accountId=document.getElementById('link-request-account').value;if(!accountId)return;button.disabled=true;status.textContent='';status.className='field-help status-message';postAccessRequestAction('/api/admin/access-requests/'+encodeURIComponent(id)+'/link',{admin_user_id:accountId},status).then(function(){status.textContent=I18N.t('users.accessRequests.linked');loadAccessRequests();load();}).catch(function(message){status.textContent=message;status.className='field-error status-message';}).finally(function(){button.disabled=false;});});
  document.getElementById('create-request-form').addEventListener('submit',function(event){event.preventDefault();if(!window.confirm(I18N.t('users.accessRequests.confirmCreate')))return;var button=document.getElementById('create-request-submit'),status=document.getElementById('create-request-status-msg'),id=document.getElementById('create-request-id').value;button.disabled=true;status.textContent='';status.className='field-help status-message';postAccessRequestAction('/api/admin/access-requests/'+encodeURIComponent(id)+'/create-account',{name:document.getElementById('create-request-name').value.trim()||null,role:document.getElementById('create-request-role').value,status:document.getElementById('create-request-status').value},status).then(function(){status.textContent=I18N.t('users.accessRequests.created');loadAccessRequests();load();}).catch(function(message){status.textContent=message;status.className='field-error status-message';}).finally(function(){button.disabled=false;});});
  function setRoleChoices(){var canAssignOwner=state.currentRole==='owner';document.querySelectorAll('#invite-role option[value="owner"],#role-select option[value="owner"],#create-request-role option[value="owner"]').forEach(function(option){option.disabled=!canAssignOwner;});}
  function loadCurrentUser(){fetch('/api/auth/me',{credentials:'include'}).then(function(response){if(!response.ok)throw Error();return response.json();}).then(function(user){state.currentUserId=user.id||null;state.currentRole=user.role||null;state.canManageUsers=Boolean(user.authenticated&&(user.role==='admin'||user.role==='owner'));setRoleChoices();document.getElementById('invite-open').classList.toggle('hidden',!state.canManageUsers);document.getElementById('access-requests-section').classList.toggle('hidden',!state.canManageUsers);load();loadAccessRequests();}).catch(function(){setStatus(I18N.t('users.requestFailed'),true);});}

}());
