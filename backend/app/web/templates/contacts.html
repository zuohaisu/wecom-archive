<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部联系人</title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>.contact-cell{display:flex;align-items:center;gap:10px;min-width:0}.contact-tags{display:flex;flex-wrap:wrap;gap:4px}.status-message{min-height:1.3em}@media(max-width:900px){.side-nav{display:none}.page{padding:var(--space-4)}.table-wrap{overflow-x:auto}}</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="contacts.breadcrumbDirectory">通讯录</span><span class="sep">/</span><span class="cur" data-i18n="contacts.pageTitle">外部联系人</span></div></header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="contacts.pageTitle">外部联系人</h1><p data-i18n="contacts.description">浏览由企业微信通讯录同步的客户与合作方。</p></div></div>
    <form class="toolbar" id="contacts-filters">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="company-filter" type="search" data-i18n-placeholder="contacts.companyPlaceholder" placeholder="搜索所属企业"></div>
      <input class="input" id="tag-filter" type="search" data-i18n-placeholder="contacts.tagPlaceholder" placeholder="按标签筛选">
      <input class="input" id="owner-filter" type="search" data-i18n-placeholder="contacts.ownerPlaceholder" placeholder="归属员工 UserID">
      <button class="btn btn-primary" type="submit" data-i18n="contacts.applyFilters">应用筛选</button>
      <button class="btn" type="button" id="clear-filters" data-i18n="contacts.clearFilters">清除</button>
    </form>
    <p id="contacts-status" class="field-help status-message" role="status" aria-live="polite"></p>
    <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="contacts.contact">联系人</th><th data-i18n="contacts.company">所属企业</th><th data-i18n="contacts.tags">标签</th><th data-i18n="contacts.owner">归属员工</th><th class="num" data-i18n="contacts.messages">会话数</th><th data-i18n="contacts.lastInteraction">最后互动</th></tr></thead><tbody id="contacts-body"><tr><td colspan="6" class="loading" data-i18n="contacts.loading">正在加载外部联系人…</td></tr></tbody></table><div class="card-ft"><div class="pagination" id="contacts-pagination"></div></div></div>
  </main>
</div></div>
<script>
(function(){
  var state={offset:0,limit:24,total:0};
  function t(key){return I18N.t(key);}
  function translate(){document.documentElement.lang=I18N.getLocale();document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=t(el.getAttribute('data-i18n-placeholder'));});document.title=t('contacts.pageTitle');}
  function textCell(value){var cell=document.createElement('td');cell.textContent=value == null || value === '' ? '—' : String(value);return cell;}
  function status(message,error){var node=document.getElementById('contacts-status');node.textContent=message || '';node.className=(error?'field-error':'field-help')+' status-message';}
  function formatDate(value){if(!value)return '—';var date=new Date(value);return isNaN(date)?value:date.toLocaleString(I18N.getLocale());}
  function render(items){var body=document.getElementById('contacts-body');body.textContent='';if(!items.length){var row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=6;cell.className='empty';cell.textContent=t('contacts.empty');row.appendChild(cell);body.appendChild(row);return;}items.forEach(function(item){var row=document.createElement('tr'),contact=document.createElement('td'),wrap=document.createElement('div'),avatar=document.createElement('span'),info=document.createElement('div'),name=document.createElement('div'),id=document.createElement('div'),tags=document.createElement('td'),tagWrap=document.createElement('div');wrap.className='contact-cell';avatar.className='avatar avatar-sm';avatar.textContent=(item.name||item.external_userid||'?').slice(0,1);info.className='ellipsis';name.className='cell-primary';name.textContent=item.name||t('contacts.unnamed');id.className='cell-id';id.textContent=item.external_userid;info.appendChild(name);info.appendChild(id);wrap.appendChild(avatar);wrap.appendChild(info);contact.appendChild(wrap);row.appendChild(contact);row.appendChild(textCell(item.company));tagWrap.className='contact-tags';(item.tags||[]).forEach(function(tag){var badge=document.createElement('span');badge.className='tag tag-neutral';badge.textContent=tag;tagWrap.appendChild(badge);});if(!item.tags||!item.tags.length)tagWrap.textContent='—';tags.appendChild(tagWrap);row.appendChild(tags);row.appendChild(textCell(item.owner_display_name));var messages=textCell(Number(item.message_count||0).toLocaleString());messages.className='num';row.appendChild(messages);row.appendChild(textCell(formatDate(item.last_interaction_at)));body.appendChild(row);});}
  function pagination(){var node=document.getElementById('contacts-pagination'),previous=document.createElement('button'),next=document.createElement('button'),summary=document.createElement('span'),pages=document.createElement('div');node.textContent='';summary.textContent=t('contacts.results').replace('{n}',state.total);previous.type=next.type='button';previous.className=next.className='page-btn';previous.textContent='‹';next.textContent='›';previous.disabled=state.offset===0;next.disabled=state.offset+state.limit>=state.total;previous.addEventListener('click',function(){state.offset=Math.max(0,state.offset-state.limit);load();});next.addEventListener('click',function(){state.offset+=state.limit;load();});pages.className='pages';pages.appendChild(previous);pages.appendChild(next);node.appendChild(summary);node.appendChild(pages);}
  function load(){status('');var params=new URLSearchParams({offset:String(state.offset),limit:String(state.limit)}),company=document.getElementById('company-filter').value.trim(),tags=document.getElementById('tag-filter').value.trim(),owner=document.getElementById('owner-filter').value.trim();if(company)params.set('company',company);if(tags)params.set('tags',tags);if(owner)params.set('owner_wecom_userid',owner);fetch('/api/admin/external-contacts?'+params.toString(),{credentials:'include'}).then(function(response){if(!response.ok)return response.json().catch(function(){return {};}).then(function(body){throw new Error(body.detail||t('contacts.loadFailed'));});return response.json();}).then(function(data){state.total=data.total;render(data.items);pagination();}).catch(function(error){status(error.message||t('contacts.loadFailed'),true);});}
  document.getElementById('contacts-filters').addEventListener('submit',function(event){event.preventDefault();state.offset=0;load();});document.getElementById('clear-filters').addEventListener('click',function(){document.getElementById('contacts-filters').reset();state.offset=0;load();});document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};I18N.onChange(function(){translate();load();});translate();load();
}());
</script>
</body>
</html>
