<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>外部联系人</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>.contact-cell{display:flex;align-items:center;gap:10px;min-width:0}.contact-tags{display:flex;flex-wrap:wrap;gap:4px}.status-message{min-height:1.3em}.cell-secondary{font-size:.75rem;color:var(--color-text-3)}.detail-heading{margin-bottom:2px}.detail-section{margin-top:var(--space-4)}.detail-section h4{font-size:var(--text-sm);margin-bottom:4px}.detail-row{display:flex;gap:var(--space-3);padding:6px 0;border-bottom:1px solid var(--color-border)}.detail-label{width:120px;flex-shrink:0;color:var(--color-text-3);font-size:.85rem}.detail-value{flex:1;min-width:0;word-break:break-word}.detail-conv-list{list-style:none;padding:0;margin:4px 0 0}.detail-conv-list li{padding:4px 0}.contacts-pagination-controls,.contacts-page-size,.contacts-page-jump{display:flex;align-items:center;gap:var(--space-2)}.contacts-pagination-controls{margin-left:auto;flex-wrap:wrap;justify-content:flex-end}.contacts-pagination-controls .pages{margin-left:0}.contacts-page-size,.contacts-page-jump{white-space:nowrap}.contacts-page-size .select{min-width:94px}.contacts-page-jump .input{width:4.5em;height:var(--control-h-sm);padding:0 6px}@media(max-width:900px){.side-nav{display:none}.page{padding:var(--space-4)}.table-wrap{overflow-x:auto}.pagination{flex-wrap:wrap}.contacts-pagination-controls{width:100%;margin-left:0;justify-content:flex-start}}</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="contacts.breadcrumbDirectory">通讯录</span><span class="sep">/</span><span class="cur" data-i18n="contacts.pageTitle">外部联系人</span></div></header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="contacts.pageTitle">外部联系人</h1><p data-i18n="contacts.description">浏览由企业微信通讯录同步的客户与合作方。</p></div></div>
    <form class="toolbar toolbar-compact" id="contacts-filters">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="q-filter" type="search" data-i18n-placeholder="contacts.searchPlaceholder" placeholder="搜索备注名、当前昵称或历史昵称"></div>
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="company-filter" type="search" data-i18n-placeholder="contacts.companyPlaceholder" placeholder="搜索所属企业"></div>
      <select class="select" id="tag-filter" aria-label="按标签筛选"><option value="" data-i18n="contacts.tagAll">全部标签</option></select>
      <input class="input" id="owner-filter" type="search" data-i18n-placeholder="contacts.ownerPlaceholder" placeholder="归属员工 UserID">
      <button class="btn btn-primary" type="submit" data-i18n="contacts.applyFilters">应用筛选</button>
      <button class="btn" type="button" id="clear-filters" data-i18n="contacts.clearFilters">清除</button>
    </form>
    <p id="contacts-status" class="field-help status-message" role="status" aria-live="polite"></p>
    <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="contacts.contact">联系人</th><th data-i18n="contacts.company">所属企业</th><th data-i18n="contacts.tags">标签</th><th data-i18n="contacts.owner">归属员工</th><th class="num" data-i18n="contacts.messages">会话数</th><th data-i18n="contacts.lastInteraction">最后互动</th><th data-i18n="contacts.actions">操作</th></tr></thead><tbody id="contacts-body"><tr><td colspan="7" class="loading" data-i18n="contacts.loading">正在加载外部联系人…</td></tr></tbody></table><div class="card-ft"><div class="pagination" id="contacts-pagination"></div></div></div>
  </main>
</div></div>
<div class="modal-backdrop hidden" id="contact-drawer"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="contact-drawer-title"><div class="modal-hd"><h2 id="contact-drawer-title" data-i18n="contacts.detailTitle">联系人详情</h2><button class="modal-close" type="button" id="contact-drawer-close" aria-label="Close">×</button></div><div class="modal-bd" id="contact-drawer-body"></div></div></div>
<script src="/web/static/avatar.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  var state={offset:0,limit:20,total:0};
  function t(key){return I18N.t(key);}
  function interpolate(key,values){var value=t(key);Object.keys(values||{}).forEach(function(name){value=value.replace('{'+name+'}',String(values[name]));});return value;}
  function translate(){document.documentElement.lang=I18N.getLocale();document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=t(el.getAttribute('data-i18n-placeholder'));});document.title=t('contacts.pageTitle');}
  function textCell(value){var cell=document.createElement('td');cell.textContent=value == null || value === '' ? '—' : String(value);return cell;}
  function status(message,error){var node=document.getElementById('contacts-status');node.textContent=message || '';node.className=(error?'field-error':'field-help')+' status-message';}
  function formatDate(value){if(!value)return '—';var date=new Date(value);return isNaN(date)?value:date.toLocaleString(I18N.getLocale());}
  function renderTagOptions(tags){var select=document.getElementById('tag-filter'),selected=select.value;select.textContent='';var all=document.createElement('option');all.value='';all.textContent=t('contacts.tagAll');select.appendChild(all);(tags||[]).forEach(function(tag){var option=document.createElement('option');option.value=tag;option.textContent=tag;select.appendChild(option);});select.value=selected;}
  function render(items){var body=document.getElementById('contacts-body');body.textContent='';if(!items.length){var row=document.createElement('tr'),cell=document.createElement('td');cell.colSpan=7;cell.className='empty';cell.textContent=t('contacts.empty');row.appendChild(cell);body.appendChild(row);return;}items.forEach(function(item){var row=document.createElement('tr'),contact=document.createElement('td'),wrap=document.createElement('div'),avatar=ArchiveAvatar.element(item.avatar_url,item.display_name||item.external_userid,'avatar avatar-sm'),info=document.createElement('div'),name=document.createElement('div'),nickname=document.createElement('div'),id=document.createElement('div'),tags=document.createElement('td'),tagWrap=document.createElement('div'),actions=document.createElement('td'),detailBtn=document.createElement('button');wrap.className='contact-cell';info.className='ellipsis';name.className='cell-primary';name.textContent=item.display_name;nickname.className='cell-secondary';if(item.current_nickname&&item.current_nickname!==item.display_name){nickname.textContent=item.current_nickname;}id.className='cell-id';id.textContent=item.external_userid;info.appendChild(name);if(nickname.textContent)info.appendChild(nickname);info.appendChild(id);wrap.appendChild(avatar);wrap.appendChild(info);contact.appendChild(wrap);row.appendChild(contact);row.appendChild(textCell(item.company));tagWrap.className='contact-tags';(item.tags||[]).forEach(function(tag){var badge=document.createElement('span');badge.className='tag tag-neutral';badge.textContent=tag;tagWrap.appendChild(badge);});if(!item.tags||!item.tags.length)tagWrap.textContent='—';tags.appendChild(tagWrap);row.appendChild(tags);row.appendChild(textCell(item.owner_display_name));var messages=textCell(Number(item.message_count||0).toLocaleString());messages.className='num';row.appendChild(messages);row.appendChild(textCell(formatDate(item.last_interaction_at)));detailBtn.type='button';detailBtn.className='btn btn-sm';detailBtn.setAttribute('data-i18n','contacts.viewDetail');detailBtn.textContent=t('contacts.viewDetail');detailBtn.addEventListener('click',function(){openDrawer(item.external_userid);});actions.appendChild(detailBtn);row.appendChild(actions);body.appendChild(row);});}
  function pageCount(){return Math.max(1,Math.ceil(state.total/state.limit));}
  function currentPage(){return Math.min(pageCount(),Math.floor(state.offset/state.limit)+1);}
  function goToPage(page){page=Math.max(1,Math.min(pageCount(),Math.floor(Number(page)||1)));state.offset=(page-1)*state.limit;load();}
  function visiblePages(page,pages){var start=Math.max(1,page-1),end=Math.min(pages,page+1),result=[];if(page<=2)end=Math.min(pages,3);if(page>=pages-1)start=Math.max(1,pages-2);for(var value=start;value<=end;value++)result.push(value);if(result[0]!==1)result.unshift(1);if(result[result.length-1]!==pages)result.push(pages);return result;}
  function pagination(){var node=document.getElementById('contacts-pagination'),pagesTotal=pageCount(),page=currentPage(),summary=document.createElement('span'),controls=document.createElement('div'),perPageLabel=document.createElement('label'),perPageText=document.createElement('span'),perPage=document.createElement('select'),pages=document.createElement('div'),previous=document.createElement('button'),next=document.createElement('button'),jump=document.createElement('form'),jumpText=document.createElement('span'),jumpInput=document.createElement('input'),jumpUnit=document.createElement('span'),jumpButton=document.createElement('button'),lastVisiblePage=0;node.textContent='';summary.setAttribute('aria-live','polite');summary.textContent=state.total?interpolate('contacts.paginationSummary',{page:page,pages:pagesTotal,from:state.offset+1,to:Math.min(state.offset+state.limit,state.total),total:state.total}):t('contacts.paginationEmpty');controls.className='contacts-pagination-controls';perPageLabel.className='contacts-page-size';perPageText.textContent=t('contacts.pageSize');perPage.className='select';perPage.setAttribute('aria-label',t('contacts.pageSize'));[20,50,100].forEach(function(size){var option=document.createElement('option');option.value=String(size);option.textContent=interpolate('contacts.perPageOption',{n:size});option.selected=size===state.limit;perPage.appendChild(option);});perPage.addEventListener('change',function(){state.limit=Number(perPage.value);state.offset=0;load();});perPageLabel.appendChild(perPageText);perPageLabel.appendChild(perPage);previous.type=next.type='button';previous.className=next.className='page-btn';previous.textContent='‹';next.textContent='›';previous.setAttribute('aria-label',t('contacts.previousPage'));next.setAttribute('aria-label',t('contacts.nextPage'));previous.disabled=page===1;next.disabled=page===pagesTotal;previous.addEventListener('click',function(){goToPage(page-1);});next.addEventListener('click',function(){goToPage(page+1);});pages.className='pages';pages.appendChild(previous);visiblePages(page,pagesTotal).forEach(function(visiblePage){if(lastVisiblePage&&visiblePage>lastVisiblePage+1){var ellipsis=document.createElement('span');ellipsis.className='page-btn';ellipsis.setAttribute('aria-hidden','true');ellipsis.textContent='…';pages.appendChild(ellipsis);}var button=document.createElement('button');button.type='button';button.className='page-btn'+(visiblePage===page?' active':'');button.textContent=String(visiblePage);button.setAttribute('aria-label',interpolate('contacts.goToPage',{page:visiblePage}));if(visiblePage===page){button.setAttribute('aria-current','page');}else{button.addEventListener('click',function(){goToPage(visiblePage);});}pages.appendChild(button);lastVisiblePage=visiblePage;});pages.appendChild(next);jump.className='contacts-page-jump';jumpText.textContent=t('contacts.jumpToPage');jumpInput.className='input';jumpInput.type='number';jumpInput.min='1';jumpInput.max=String(pagesTotal);jumpInput.value=String(page);jumpInput.inputMode='numeric';jumpInput.setAttribute('aria-label',t('contacts.jumpToPage'));jumpUnit.textContent=t('contacts.pageUnit');jumpButton.type='submit';jumpButton.className='page-btn';jumpButton.textContent=t('contacts.jump');jump.addEventListener('submit',function(event){event.preventDefault();var requestedPage=Number(jumpInput.value);if(!Number.isInteger(requestedPage)||requestedPage<1||requestedPage>pagesTotal){jumpInput.value=String(page);return;}goToPage(requestedPage);});jump.appendChild(jumpText);jump.appendChild(jumpInput);jump.appendChild(jumpUnit);jump.appendChild(jumpButton);controls.appendChild(perPageLabel);controls.appendChild(pages);controls.appendChild(jump);node.appendChild(summary);node.appendChild(controls);}
  function load(){status('');var params=new URLSearchParams({offset:String(state.offset),limit:String(state.limit)}),q=document.getElementById('q-filter').value.trim(),company=document.getElementById('company-filter').value.trim(),tags=document.getElementById('tag-filter').value.trim(),owner=document.getElementById('owner-filter').value.trim();if(q)params.set('q',q);if(company)params.set('company',company);if(tags)params.set('tags',tags);if(owner)params.set('owner_wecom_userid',owner);fetch('/api/admin/external-contacts?'+params.toString(),{credentials:'include'}).then(function(response){if(!response.ok)return response.json().catch(function(){return {};}).then(function(body){throw new Error(body.detail||t('contacts.loadFailed'));});return response.json();}).then(function(data){state.total=data.total;renderTagOptions(data.available_tags);render(data.items);pagination();}).catch(function(error){status(error.message||t('contacts.loadFailed'),true);});}
  function detailField(label,value){var row=document.createElement('div');row.className='detail-row';var lab=document.createElement('div');lab.className='detail-label';lab.textContent=label;var val=document.createElement('div');val.className='detail-value';val.textContent=value==null||value===''?'—':String(value);row.appendChild(lab);row.appendChild(val);return row;}
  function renderDrawer(item){var body=document.getElementById('contact-drawer-body');body.textContent='';body.appendChild(ArchiveAvatar.element(item.avatar_url,item.display_name||item.external_userid,'avatar avatar-lg'));var heading=document.createElement('h3');heading.className='detail-heading';heading.textContent=item.display_name;body.appendChild(heading);var idLine=document.createElement('p');idLine.className='field-help cell-id';idLine.textContent=item.external_userid;body.appendChild(idLine);var exportLink=document.createElement('a');exportLink.className='btn btn-sm';exportLink.href='/admin/exports?participant_id='+encodeURIComponent(item.external_userid);exportLink.textContent=t('exports.openCustomer');body.appendChild(exportLink);var remarksSection=document.createElement('div');remarksSection.className='detail-section';var remarksTitle=document.createElement('h4');remarksTitle.textContent=t('contacts.remarkName');remarksSection.appendChild(remarksTitle);var remarks=(item.follow_remarks||[]).filter(function(remark){return remark.remark;});if(!remarks.length){var noRemarks=document.createElement('p');noRemarks.className='field-help';noRemarks.textContent='—';remarksSection.appendChild(noRemarks);}else{var remarksList=document.createElement('ul');remarksList.className='detail-conv-list';remarks.forEach(function(remark){var li=document.createElement('li');li.textContent=(remark.follow_user_display_name||remark.follow_userid)+'：'+remark.remark;remarksList.appendChild(li);});remarksSection.appendChild(remarksList);}body.appendChild(remarksSection);body.appendChild(detailField(t('contacts.currentNickname'),item.current_nickname));var historySection=document.createElement('div');historySection.className='detail-section';var historyTitle=document.createElement('h4');historyTitle.textContent=t('contacts.nicknameHistory');historySection.appendChild(historyTitle);var history=(item.nickname_history||[]).slice().reverse();if(!history.length){var noHistory=document.createElement('p');noHistory.className='field-help';noHistory.textContent=t('contacts.noNicknameHistory');historySection.appendChild(noHistory);}else{var historyList=document.createElement('ul');historyList.className='detail-conv-list';history.forEach(function(entry){var li=document.createElement('li'),oldName=entry.old_nickname||'—',newName=entry.new_nickname||'—';li.textContent=oldName+' → '+newName+' · '+formatDate(entry.observed_at);historyList.appendChild(li);});historySection.appendChild(historyList);}body.appendChild(historySection);body.appendChild(detailField(t('contacts.company'),item.company));body.appendChild(detailField(t('contacts.tags'),(item.tags||[]).join('、')));body.appendChild(detailField(t('contacts.source'),item.source));body.appendChild(detailField(t('contacts.owner'),item.owner_display_name));body.appendChild(detailField(t('contacts.lastInteraction'),formatDate(item.last_interaction_at)));var convSection=document.createElement('div');convSection.className='detail-section';var convTitle=document.createElement('h4');convTitle.textContent=t('contacts.relatedConversations');convSection.appendChild(convTitle);var conversations=item.conversations||[];if(!conversations.length){var empty=document.createElement('p');empty.className='field-help';empty.textContent=t('contacts.noConversations');convSection.appendChild(empty);}else{var list=document.createElement('ul');list.className='detail-conv-list';conversations.forEach(function(conv){var li=document.createElement('li'),link=document.createElement('a');link.href='/admin/conversations?conv='+encodeURIComponent(conv.conversation_id)+'&convType='+encodeURIComponent(conv.conversation_type)+'&entityId='+encodeURIComponent(item.external_userid)+'&entityType=contact';link.textContent=conv.display_name||conv.conversation_id;li.appendChild(link);list.appendChild(li);});convSection.appendChild(list);}body.appendChild(convSection);}
  function openDrawer(externalUserid){var backdrop=document.getElementById('contact-drawer'),body=document.getElementById('contact-drawer-body');backdrop.classList.remove('hidden');body.textContent='';var loading=document.createElement('p');loading.className='field-help';loading.textContent=t('contacts.detailLoading');body.appendChild(loading);fetch('/api/admin/external-contacts/'+encodeURIComponent(externalUserid),{credentials:'include'}).then(function(response){if(!response.ok)return response.json().catch(function(){return {};}).then(function(errBody){throw new Error(errBody.detail||t('contacts.detailLoadFailed'));});return response.json();}).then(function(item){renderDrawer(item);}).catch(function(error){body.textContent='';var err=document.createElement('p');err.className='field-error';err.textContent=error.message||t('contacts.detailLoadFailed');body.appendChild(err);});}
  function closeDrawer(){document.getElementById('contact-drawer').classList.add('hidden');}
  document.getElementById('contact-drawer-close').addEventListener('click',closeDrawer);
  document.getElementById('contact-drawer').addEventListener('click',function(event){if(event.target===document.getElementById('contact-drawer'))closeDrawer();});
  document.getElementById('contacts-filters').addEventListener('submit',function(event){event.preventDefault();state.offset=0;load();});document.getElementById('clear-filters').addEventListener('click',function(){document.getElementById('contacts-filters').reset();state.offset=0;load();});document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};I18N.onChange(function(){translate();load();});translate();load();
}());
</script>
