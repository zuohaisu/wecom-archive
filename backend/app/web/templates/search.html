<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索结果 · 对话审阅控制台</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="apple-touch-icon" href="/api/branding/favicon">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;color:var(--color-text);background:var(--color-canvas);height:100vh;overflow:hidden}
.search-topbar{justify-content:space-between}
.search-bar{position:relative;flex:0 1 320px;min-width:0}
.search-bar form{display:flex;align-items:center;position:relative}
.search-bar input{width:100%;padding:.22rem .6rem .22rem 1.7rem;border:1px solid var(--color-border-strong);border-radius:4px;background:#f6f8fb;color:#1f2329;font-size:.8rem;outline:none;box-sizing:border-box;padding-right:3.4rem}
.search-bar input:focus{border-color:var(--color-primary);background:#fff}
.search-bar input::placeholder{color:#a6adb8}
.search-bar .ico{position:absolute;left:.55rem;color:#a6adb8;font-size:.85rem;pointer-events:none}
.search-bar .enter-hint{position:absolute;right:.5rem;font-size:.66rem;color:#a6adb8;border:1px solid var(--color-border-strong);border-radius:3px;padding:0 .3rem;pointer-events:none}
.spin-ring{display:none;position:absolute;left:.55rem;top:50%;transform:translateY(-50%);width:.85rem;height:.85rem;border:2px solid var(--color-border-strong);border-top-color:var(--color-primary);border-radius:50%;pointer-events:none;box-sizing:border-box}
form.busy .spin-ring{display:block}
form.busy .ico{display:none}
.search-loading{display:none;align-items:center;gap:.35rem;font-size:.8rem;color:var(--color-text-3);white-space:nowrap}
.search-loading .spin-dot{width:.85rem;height:.85rem;border:2px solid var(--color-border-strong);border-top-color:var(--color-primary);border-radius:50%;animation:searchspin .8s linear infinite;flex-shrink:0}
@keyframes searchspin{to{transform:rotate(360deg)}}
.state-landing form .spin-ring{position:static;transform:none;margin-right:-.3rem}
.state-landing form.busy .spin-ring{display:block}
.state-landing form.busy .ico{display:none}
.results-page{flex:1;display:flex;flex-direction:column;overflow:hidden}
.results-header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--color-surface);border-bottom:1px solid var(--color-border);flex-shrink:0}
.query-heading{font-size:1.05rem;font-weight:600;display:flex;align-items:baseline;gap:.6rem;min-width:0;flex:1;overflow:hidden}
.query-heading .q{color:var(--color-primary)}
.query-heading .count{font-size:.8rem;font-weight:400;color:var(--color-text-3);white-space:nowrap}
.sort-control{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--color-text-3);white-space:nowrap}
.sort-control select{border:1px solid var(--color-border);border-radius:4px;padding:.2rem .4rem;font-size:.78rem;color:var(--color-text-2);background:#fff}
.results-body{flex:1;overflow-y:auto;padding:1rem 1.25rem 2rem}
.results-list{display:flex;flex-direction:column;gap:.7rem;max-width:920px;margin:0 auto}
.result-card{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:.7rem .85rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.result-card:hover{border-color:var(--color-primary);box-shadow:var(--shadow-2);background:#fafcff}
.rc-context{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.rc-badge{font-size:.68rem;padding:.05rem .35rem;border-radius:2px;font-weight:600;border:1px solid}
.rc-badge.group{background:#e6f7ff;color:#0958d9;border-color:#91caff}
.rc-badge.direct{background:#f6ffed;color:#389e0d;border-color:#b7eb8f}
.rc-conv{font-weight:600;font-size:.86rem;color:var(--color-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-sender{font-size:.78rem;color:var(--color-text-2)}
.rc-sender.staff{color:var(--color-primary-hover);font-weight:600}
.rc-time{margin-left:auto;font-size:.72rem;color:var(--color-text-4);white-space:nowrap}
.rc-snippet{font-size:.85rem;color:#444;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.rc-snippet mark{background:transparent;color:#e00;font-weight:700}
.rc-foot{display:flex;align-items:center;gap:.5rem;margin-top:.45rem;font-size:.72rem;color:var(--color-text-3)}
.rc-route{display:inline-flex;align-items:center;gap:.25rem}
.rc-route .arrow{color:var(--color-text-4)}
.rc-jump{margin-left:auto;color:var(--color-primary);font-weight:500;opacity:0;transition:opacity .15s}
.result-card:hover .rc-jump{opacity:1}
.state{padding:3rem 1rem;text-align:center;color:var(--color-text-3);font-size:.9rem}
.state .state-ico{font-size:1.6rem;display:block;margin-bottom:.6rem;opacity:.6}
.state-empty .hint{margin-top:.4rem;font-size:.8rem;color:var(--color-text-4)}
.state-error{color:var(--color-danger-fg);background:var(--color-danger-bg);border:1px solid var(--color-danger-border);border-radius:var(--radius-sm);max-width:420px;margin:2rem auto}
.state-landing{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:55vh;padding:2rem 1rem}
.state-landing .landing-title{font-size:1.15rem;font-weight:600;color:var(--color-text);margin-bottom:1.4rem}
.state-landing form{display:flex;align-items:center;width:100%;max-width:584px;border:1px solid var(--color-border);border-radius:24px;padding:.2rem .3rem .2rem 1.1rem;background:#fff;box-shadow:var(--shadow-2);transition:border-color .15s}
.state-landing form:focus-within{border-color:var(--color-primary)}
.state-landing .ico{color:var(--color-text-3);font-size:.95rem;margin-right:.6rem;flex-shrink:0}
.state-landing input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:.95rem;padding:.55rem 0;color:var(--color-text)}
.state-landing button{border:none;background:var(--color-primary);color:#fff;padding:.5rem 1.15rem;border-radius:18px;font-size:.85rem;cursor:pointer;margin-left:.5rem;white-space:nowrap}
.state-landing button:hover{background:var(--color-primary-hover)}
.skeleton{background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm);padding:.7rem .85rem;max-width:920px;margin:0 auto .7rem}
.sk-line{height:.7rem;border-radius:4px;background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;margin-bottom:.5rem}
.sk-line.short{width:40%}
.sk-line.mid{width:70%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}
@media (prefers-reduced-motion: reduce){.sk-line{animation:none}.search-loading .spin-dot{animation:none}}
.filter-bar{position:sticky;top:0;z-index:5;background:var(--color-surface);border-bottom:1px solid var(--color-border);padding:.55rem 1.25rem;display:flex;flex-direction:column;gap:.5rem;flex-shrink:0}
.filter-triggers{display:flex;gap:.5rem;flex-wrap:wrap}
.filter-group{position:relative}
.filter-btn{display:inline-flex;align-items:center;gap:.35rem;padding:.28rem .65rem;font-size:.8rem;color:var(--color-text-2);background:#fff;border:1px solid var(--color-border);border-radius:4px;cursor:pointer;min-height:32px}
.filter-btn:hover{border-color:var(--color-primary)}
.filter-btn.active{border-color:var(--color-primary);background:var(--color-primary-soft);color:var(--color-primary-hover)}
.filter-btn .filter-badge{display:none;background:var(--color-primary);color:#fff;font-size:.66rem;line-height:1;padding:.14rem .4rem;border-radius:999px}
.filter-btn.active .filter-badge:not(:empty){display:inline-block}
.filter-popover{position:absolute;top:calc(100% + 6px);left:0;min-width:220px;max-width:300px;max-height:320px;overflow-y:auto;background:#fff;border:1px solid var(--color-border);border-radius:var(--radius-sm);box-shadow:var(--shadow-2);padding:.5rem;z-index:20;display:none}
.filter-popover.open{display:block}
.filter-popover .fp-search{width:100%;padding:.3rem .5rem;border:1px solid var(--color-border);border-radius:4px;font-size:.78rem;margin-bottom:.4rem;box-sizing:border-box}
.filter-opt{display:flex;align-items:center;gap:.4rem;padding:.32rem .3rem;font-size:.82rem;color:var(--color-text);border-radius:4px;cursor:pointer}
.filter-opt:hover{background:var(--color-surface-header)}
.filter-opt input{margin:0}
.filter-opt-empty{padding:.5rem .3rem;font-size:.78rem;color:var(--color-text-4)}
.filter-chips{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;background:var(--color-primary-soft);color:var(--color-primary-hover);font-size:.78rem;padding:.22rem .55rem;border-radius:999px;min-height:24px}
.chip-x{border:none;background:transparent;color:var(--color-primary-hover);cursor:pointer;font-size:.85rem;line-height:1;padding:0}
.chip-x:hover{color:var(--color-primary)}
.filter-clear-all{border:none;background:transparent;color:var(--color-text-3);font-size:.78rem;cursor:pointer;text-decoration:underline;min-height:24px}
.filter-clear-all:hover{color:var(--color-text)}
@media(max-width:640px){.search-topbar{align-items:center}.search-topbar .breadcrumb{display:none}.search-bar{flex:1}.results-header{padding-inline:.75rem}.results-body{padding-inline:.75rem}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
<header class="topbar search-topbar">
  <div class="breadcrumb"><span data-i18n="nav.group.review">审阅</span><span class="sep">/</span><span class="cur" data-i18n="nav.globalSearch">全局搜索</span></div>
  <div class="search-bar">
    <form id="searchForm" onsubmit="return doTopSearch(event)">
      <span class="ico">🔍</span><span class="spin-ring"></span>
      <input type="text" id="topSearch" placeholder="搜索联系人或聊天内容…" autocomplete="off">
      <span class="enter-hint">↵ 结果页</span>
    </form>
  </div>
</header>
<div class="results-page" id="resultsPage">
  <div class="results-header">
    <div class="query-heading">
      <span id="qLabel"></span>
      <span class="count" id="resultCount"></span>
      <span class="search-loading" id="searchLoading"><span class="spin-dot"></span><span data-i18n="search.loading">搜索中…</span></span>
    </div>
    <div class="sort-control">
      <button type="button" class="btn btn-sm" id="export-search-results" onclick="exportSearchResults()" data-i18n="exports.openSearchResults" disabled>导出当前结果</button>
      <label for="sortSel">排序</label>
      <select id="sortSel" onchange="render()">
        <option value="time_desc" selected>时间（新→旧）</option>
        <option value="time_asc">时间（旧→新）</option>
      </select>
    </div>
  </div>
  <div class="filter-bar" id="filterBar">
    <div class="filter-triggers">
      <div class="filter-group">
        <button type="button" class="filter-btn" id="fbtn-date" onclick="toggleFilterPopover('date')"><span data-i18n="search.filter.date">日期</span><span class="filter-badge" id="fbadge-date"></span></button>
        <div class="filter-popover" id="fpop-date"></div>
      </div>
      <div class="filter-group">
        <button type="button" class="filter-btn" id="fbtn-user" onclick="toggleFilterPopover('user')"><span data-i18n="search.filter.user">用户</span><span class="filter-badge" id="fbadge-user"></span></button>
        <div class="filter-popover" id="fpop-user"></div>
      </div>
      <div class="filter-group">
        <button type="button" class="filter-btn" id="fbtn-staff" onclick="toggleFilterPopover('staff')"><span data-i18n="search.filter.staff">员工</span><span class="filter-badge" id="fbadge-staff"></span></button>
        <div class="filter-popover" id="fpop-staff"></div>
      </div>
      <div class="filter-group">
        <button type="button" class="filter-btn" id="fbtn-msgtype" onclick="toggleFilterPopover('msgtype')"><span data-i18n="search.filter.msgtype">消息类型</span><span class="filter-badge" id="fbadge-msgtype"></span></button>
        <div class="filter-popover" id="fpop-msgtype"></div>
      </div>
    </div>
    <div class="filter-chips" id="filterChips" style="display:none"></div>
  </div>
  <div class="results-body" id="resultsBody">
    <div class="state state-landing" id="stateLanding" style="display:none">
      <div class="landing-title" data-i18n="search.landing.title">搜索聊天记录</div>
      <form id="midSearchForm" onsubmit="return doMidSearch(event)">
        <span class="ico">🔍</span><span class="spin-ring"></span>
        <input type="text" id="midSearch" placeholder="搜索联系人或聊天内容…" autocomplete="off">
        <button type="submit" data-i18n="search.landing.button">搜索</button>
      </form>
    </div>
    <div class="results-list" id="resultsList"></div>
    <div class="state state-empty" id="stateEmpty" style="display:none"><span class="state-ico">🔍</span><div>没有匹配的聊天内容</div><div class="hint" id="emptyHint">换个关键词试试</div></div>
    <div class="state state-error" id="stateError" style="display:none"><div>⚠️ 搜索失败，请稍后重试</div></div>
  </div>
</div>
</div>
</div>
<script>var RND216_MSGTYPE_OPTIONS = __MSGTYPE_OPTIONS_JSON__;</script><script src="/web/static/product-analytics.js?v=__STATIC_VERSION__"></script><script src="/web/static/search.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.textContent='';I18N.availableLocales().forEach(function(locale){var option=document.createElement('div');option.className='lang-option'+(locale.code===I18N.getLocale()?' active':'');option.dataset.locale=locale.code;option.textContent=locale.nativeName;menu.appendChild(option);});}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';fetch('/api/auth/me/preferences',{method:'PUT',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({locale:option.dataset.locale})}).catch(function(){});}});
  I18N.onChange(langMenu);langMenu();
}());
</script>
</body>
</html>
