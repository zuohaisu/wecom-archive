<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>内部员工</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.user-cell{display:flex;align-items:center;gap:10px;min-width:0}.status-message{min-height:1.3em}@media(max-width:900px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}.page{padding:var(--space-4)}.table-wrap{overflow-x:auto}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar">
    <div class="breadcrumb"><span data-i18n="nav.group.directory">通讯录</span><span class="sep">/</span><span class="cur" data-i18n="staff.pageTitle">内部员工</span></div>
    <div class="topbar-actions"></div>
  </header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="staff.pageTitle">内部员工</h1><p data-i18n="staff.description">罗列公司内部员工及其会话存档消息统计，只读展示，不提供任何操作。</p></div></div>
    <div class="toolbar toolbar-compact">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="staff-search" type="search" data-i18n-placeholder="staff.searchPlaceholder" placeholder="搜索姓名或账号"></div>
    </div>
    <p id="staff-status" class="field-help status-message" role="status" aria-live="polite"></p>
    <div class="drawer-backdrop" id="customers-backdrop" hidden></div>
    <aside class="customers-drawer" id="customers-drawer" hidden aria-label="相关客户">
      <div class="customers-drawer-hd"><h3 id="customers-staff-name" class="detail-heading"></h3><button type="button" class="modal-close" id="customers-close" aria-label="Close">×</button></div>
      <p id="customers-staff-status" class="field-help"></p>
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="customers-search" type="search" data-i18n-placeholder="staff.customersSearch" placeholder="搜索客户名称或 ID"></div>
      <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="staff.customerName">客户 / ID</th><th class="num" data-i18n="staff.customerMessages">消息数</th><th data-i18n="staff.customerLast">最近互动</th><th data-i18n="staff.customerFirst">首次互动</th></tr></thead><tbody id="customers-body"></tbody></table><div class="card-ft"><div class="pagination" id="customers-pagination"></div></div></div>
    </aside>
    <style>
.customers-drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,92vw);z-index:340;background:var(--color-surface);border-left:1px solid var(--color-border-strong);box-shadow:var(--shadow-3);padding:var(--space-5);overflow-y:auto;transform:translateX(100%);transition:transform .2s ease}
.customers-drawer.open{transform:none}
.customers-backdrop{position:fixed;inset:0;background:var(--color-overlay);z-index:335}
.staff-row{cursor:pointer}
.staff-row:hover{background:var(--color-surface-hover)}
    </style>
    <div class="table-wrap"><table class="table"><thead><tr><th data-i18n="staff.member">员工 / 账号</th><th data-i18n="staff.department">部门</th><th data-i18n="staff.seat">座席</th><th class="num" data-i18n="staff.messages30">近 30 天消息</th><th class="num" data-i18n="staff.messagesTotal">累计消息</th></tr></thead><tbody id="staff-body"><tr><td colspan="5" class="loading" data-i18n="staff.loading">正在加载员工…</td></tr></tbody></table><div class="card-ft"><div class="pagination" id="pagination"></div></div></div>
  </main>
</div></div>
<script src="/web/static/avatar.js?v=__STATIC_VERSION__"></script>
<script>
(function () {
  'use strict';
  var state={page:1,perPage:20,total:0};
  function translate(){document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=I18N.t(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=I18N.t(el.getAttribute('data-i18n-placeholder'));});document.title=I18N.t('staff.pageTitle');}
  function escapeHtml(value){var div=document.createElement('div');div.textContent=value == null ? '' : String(value);return div.innerHTML;}
  function setStatus(text,error){var el=document.getElementById('staff-status');el.textContent=text;el.className=error?'field-error status-message':'field-help status-message';}
  function render(items){var body=document.getElementById('staff-body');if(!items.length){body.innerHTML='<tr><td colspan="5" class="empty">'+escapeHtml(I18N.t('staff.empty'))+'</td></tr>';return;}body.innerHTML=items.map(function(staff){var seat=staff.has_seat?'<span class="badge badge-success">'+escapeHtml(I18N.t('staff.seatYes'))+'</span>':'<span class="badge badge-plain">'+escapeHtml(I18N.t('staff.seatNo'))+'</span>';return '<tr class="staff-row" data-staff="'+escapeHtml(staff.wecom_userid)+'"><td><div class="user-cell">'+ArchiveAvatar.html(staff.avatar_url,staff.name||staff.wecom_userid,'avatar avatar-sm')+'<div><div class="cell-primary">'+escapeHtml(staff.name||I18N.t('staff.unnamed'))+'</div><div class="cell-id">'+escapeHtml(staff.wecom_userid)+'</div></div></div></td><td>'+escapeHtml(staff.department||'—')+'</td><td>'+seat+'</td><td class="num">'+Number(staff.msg_count_30d||0).toLocaleString()+'</td><td class="num">'+Number(staff.msg_count_total||0).toLocaleString()+'</td></tr>';}).join('');}
  function renderPagination(){var pages=Math.max(1,Math.ceil(state.total/state.perPage)),el=document.getElementById('pagination');el.innerHTML='<span>'+escapeHtml(I18N.t('staff.count'))+': '+state.total+'</span><div class="pages"><button class="page-btn" data-page="'+(state.page-1)+'" '+(state.page===1?'disabled':'')+'>‹</button><span class="page-btn active">'+state.page+'</span><button class="page-btn" data-page="'+(state.page+1)+'" '+(state.page>=pages?'disabled':'')+'>›</button></div>';}
  function load(){setStatus('');var params=new URLSearchParams({page:String(state.page),per_page:String(state.perPage)});var q=document.getElementById('staff-search').value.trim();if(q)params.set('q',q);fetch('/api/admin/staff?'+params.toString(),{credentials:'include'}).then(function(response){if(!response.ok)return response.json().catch(function(){return {};}).then(function(body){throw new Error(body.detail||I18N.t('staff.requestFailed'));});return response.json();}).then(function(data){state.total=data.total;render(data.items);renderPagination();}).catch(function(error){setStatus(error.message||I18N.t('staff.requestFailed'),true);});}
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.getElementById('pagination').addEventListener('click',function(event){var page=Number(event.target.dataset.page);if(page){state.page=page;load();}});
  /* RND-374: 相关客户抽屉（只读下钻，离开页面即关闭） */
  var custState={staff:null,page:1,perPage:20,total:0};
  function openCustomers(staffId,name){custState.staff=staffId;custState.page=1;document.getElementById('customers-staff-name').textContent=name||staffId;document.getElementById('customers-staff-status').textContent='';document.getElementById('customers-drawer').hidden=false;document.getElementById('customers-drawer').classList.add('open');document.getElementById('customers-backdrop').hidden=false;document.getElementById('customers-search').value='';loadCustomers();}
  function closeCustomers(){document.getElementById('customers-drawer').hidden=true;document.getElementById('customers-drawer').classList.remove('open');document.getElementById('customers-backdrop').hidden=true;}
  function renderCustomers(items){var body=document.getElementById('customers-body');if(!items.length){body.innerHTML='<tr><td colspan="4" class="empty">—</td></tr>';return;}body.innerHTML=items.map(function(c){return '<tr><td><div class="user-cell">'+ArchiveAvatar.html(null,c.display_name||c.customer_userid,'avatar avatar-sm')+'<div><div class="cell-primary">'+escapeHtml(c.display_name||I18N.t('staff.unnamed'))+'</div><div class="cell-id">'+escapeHtml(c.customer_userid)+'</div></div></div></td><td class="num">'+(Number(c.message_count||0)).toLocaleString()+'</td><td>'+escapeHtml(c.last_interaction_at?c.last_interaction_at.slice(0,10):'—')+'</td><td>'+escapeHtml(c.first_interaction_at?c.first_interaction_at.slice(0,10):'—')+'</td></tr>';}).join('');}
  function renderCustomerPagination(){var pages=Math.max(1,Math.ceil(custState.total/custState.perPage)),el=document.getElementById('customers-pagination');el.innerHTML='<span>'+escapeHtml(I18N.t('staff.count'))+': '+custState.total+'</span><div class="pages"><button class="page-btn" data-page="'+(custState.page-1)+'" '+(custState.page===1?'disabled':'')+'>‹</button><span class="page-btn active">'+custState.page+'</span><button class="page-btn" data-page="'+(custState.page+1)+'" '+(custState.page>=pages?'disabled':'')+'>›</button></div>';}
  function loadCustomers(){var params=new URLSearchParams({page:String(custState.page),per_page:String(custState.perPage)});var q=document.getElementById('customers-search').value.trim();if(q)params.set('q',q);fetch('/api/admin/staff/'+encodeURIComponent(custState.staff)+'/customers?'+params.toString(),{credentials:'include'}).then(function(r){if(!r.ok)throw new Error('load_failed');return r.json();}).then(function(data){custState.total=data.total;renderCustomers(data.items);renderCustomerPagination();}).catch(function(){setStatus(I18N.t('staff.requestFailed'),true);});}
  document.getElementById('customers-pagination').addEventListener('click',function(event){var page=Number(event.target.dataset.page);if(page){custState.page=page;loadCustomers();}});
  document.getElementById('customers-close').addEventListener('click',closeCustomers);
  document.getElementById('customers-backdrop').addEventListener('click',closeCustomers);
  document.getElementById('customers-search').addEventListener('search',function(){custState.page=1;loadCustomers();});
  document.getElementById('staff-body').addEventListener('click',function(event){var row=event.target.closest('.staff-row');if(row)openCustomers(row.getAttribute('data-staff'),row.getAttribute('data-staff-name')||row.querySelector('.cell-primary').textContent);});
  document.getElementById('staff-search').addEventListener('search',function(){state.page=1;load();});
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});
  I18N.onChange(function(){translate();langMenu();load();});translate();langMenu();load();
}());
</script>
</body>
</html>
