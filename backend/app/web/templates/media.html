<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>媒体与附件</title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="mask-icon" href="/web/static/brand/logo-icon-mono.svg?v=__STATIC_VERSION__" color="#1F5CC4">
<link rel="manifest" href="/web/static/site.webmanifest?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/console/media-viewer.css?v=__STATIC_VERSION__">
<style>
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4)}.media-card{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1);transition:transform .15s ease,box-shadow .15s ease}.media-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}.media-thumb{height:148px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--color-surface-sunken);color:var(--color-text-4);overflow:hidden}.media-thumb img{width:100%;height:100%;object-fit:cover}.media-kind{position:absolute;top:8px;left:8px;z-index:1}.media-body{padding:10px 12px}.media-name,.media-session{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-name{font-weight:600}.media-session,.media-meta{font-size:var(--text-xs);color:var(--color-text-4);margin-top:4px}.media-footer{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-4)}.media-preview{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-decoration:none;cursor:zoom-in;text-align:inherit}.media-status{min-height:1.3em}.hidden{display:none!important}@media(max-width:900px){.side-nav{display:none}.page{padding:var(--space-4)}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="media.breadcrumbData">数据</span><span class="sep">/</span><span class="cur" data-i18n="media.pageTitle">媒体与附件</span></div></header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="media.pageTitle">媒体与附件</h1><p data-i18n="media.description">浏览归档会话中的图片、文件、语音与视频。</p></div></div>
    <div class="toolbar toolbar-compact">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="media-search" type="search" data-i18n-placeholder="media.searchPlaceholder" placeholder="搜索文件名"></div>
      <select class="select" id="media-type"><option value="" data-i18n="media.allTypes">全部类型</option><option value="image" data-i18n="media.type.image">图片</option><option value="file" data-i18n="media.type.file">文件</option><option value="voice" data-i18n="media.type.voice">语音</option><option value="video" data-i18n="media.type.video">视频</option></select>
      <select class="select" id="media-days"><option value="" data-i18n="media.allTime">全部时间</option><option value="7" data-i18n="media.days7">近 7 天</option><option value="30" data-i18n="media.days30">近 30 天</option><option value="90" data-i18n="media.days90">近 90 天</option></select>
      <select class="select" id="media-sort"><option value="newest" data-i18n="media.sortNewest">最新在前</option><option value="oldest" data-i18n="media.sortOldest">最早在前</option><option value="size_desc" data-i18n="media.sortLargest">体积从大到小</option></select>
    </div>
    <p id="media-status" class="field-help media-status" role="status" aria-live="polite"></p>
    <section id="media-grid" class="media-grid" aria-live="polite"></section>
    <div class="row gap-3 mt-6" style="justify-content:center"><button class="btn hidden" id="media-more" type="button" data-i18n="media.loadMore">加载更多</button><span class="muted" id="media-count"></span></div>
  </main>
</div></div>
<script src="/web/static/console/media-viewer.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  var state={offset:0,limit:24,total:0,items:[]};
  function t(key){return I18N.t(key);}
  function escapeHtml(value){var div=document.createElement('div');div.textContent=value==null?'':String(value);return div.innerHTML;}
  function formatSize(bytes){if(bytes==null)return '—';var units=['B','KB','MB','GB'],value=Number(bytes),unit=0;while(value>=1024&&unit<units.length-1){value/=1024;unit++;}return (unit?value.toFixed(value>=10?0:1):value)+' '+units[unit];}
  function formatDate(value){var date=new Date(value);return isNaN(date)?'—':date.toLocaleString(I18N.getLocale());}
  function mediaUrl(item){return '/api/conversations/'+encodeURIComponent(item.conversation_id)+'/messages/'+encodeURIComponent(item.msgid)+'/media?variant=thumb';}
  function mediaAccessUrl(item){return '/api/conversations/'+encodeURIComponent(item.conversation_id)+'/messages/'+encodeURIComponent(item.msgid)+'/media/access';}
  function viewerItem(item){return {kind:item.file_type||'file',accessUrl:mediaAccessUrl(item),downloadUrl:'/api/admin/media/'+encodeURIComponent(item.id)+'/download',label:item.name||t('media.unnamed'),mimeType:item.mime_type,sizeBytes:item.file_size};}
  function setStatus(text,error){var el=document.getElementById('media-status');el.textContent=text;el.className=(error?'field-error':'field-help')+' media-status';}
  function card(item,index){var type=item.file_type||'file',label=t('media.type.'+type),url=mediaUrl(item),thumb=type==='image'?'<img src="'+escapeHtml(url)+'" alt="" onerror="this.style.display=&apos;none&apos;">':'<span>'+escapeHtml(label)+'</span>',preview='<button class="media-preview" type="button" data-media-index="'+index+'" aria-label="'+escapeHtml(t('media.preview'))+'"><div class="media-thumb">'+thumb+'<span class="badge media-kind">'+escapeHtml(label)+'</span></div></button>';return '<article class="media-card">'+preview+'<div class="media-body"><div class="media-name">'+escapeHtml(item.name||t('media.unnamed'))+'</div><div class="media-session">'+escapeHtml(item.session_title||'—')+'</div><div class="media-meta">'+escapeHtml(formatDate(item.created_at))+'</div></div><div class="media-footer"><span>'+escapeHtml(formatSize(item.file_size))+'</span><span>'+escapeHtml(item.mime_type||'—')+'</span></div></article>';}
  function render(items,append){var grid=document.getElementById('media-grid'),start=append?state.items.length:0;if(!append){state.items=items.slice();grid.innerHTML=items.length?items.map(function(item,index){return card(item,index);}).join(''):'<p class="empty">'+escapeHtml(t('media.empty'))+'</p>';}else{state.items=state.items.concat(items);grid.insertAdjacentHTML('beforeend',items.map(function(item,index){return card(item,start+index);}).join(''));}}
  function params(){var p=new URLSearchParams({limit:String(state.limit),offset:String(state.offset),sort:document.getElementById('media-sort').value}),type=document.getElementById('media-type').value,days=document.getElementById('media-days').value,q=document.getElementById('media-search').value.trim();if(type)p.set('file_type',type);if(days)p.set('days',days);if(q)p.set('q',q);return p;}
  function load(append){setStatus('');fetch('/api/admin/media?'+params().toString(),{credentials:'include'}).then(function(response){if(!response.ok)throw new Error();return response.json();}).then(function(data){state.total=data.total;render(data.items,append);state.offset+=data.items.length;document.getElementById('media-count').textContent=t('media.results').replace('{n}',state.total);var more=document.getElementById('media-more');more.classList.toggle('hidden',!data.has_more);}).catch(function(){setStatus(t('media.loadFailed'),true);});}
  function reset(){state.offset=0;load(false);}
  function translate(){document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});document.querySelectorAll('[data-i18n-placeholder]').forEach(function(el){el.placeholder=t(el.getAttribute('data-i18n-placeholder'));});document.title=t('media.pageTitle');}
  function langMenu(){var menu=document.getElementById('lang-menu');if(menu)menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  ['media-type','media-days','media-sort'].forEach(function(id){document.getElementById(id).addEventListener('change',reset);});document.getElementById('media-search').addEventListener('search',reset);document.getElementById('media-more').addEventListener('click',function(){load(true);});document.getElementById('media-grid').addEventListener('click',function(event){var trigger=event.target.closest('[data-media-index]');if(!trigger)return;var index=Number(trigger.dataset.mediaIndex);if(index>=0&&index<state.items.length)openViewer(state.items.map(viewerItem),index);});document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});I18N.onChange(function(){translate();langMenu();refreshViewerLabels();reset();});translate();langMenu();reset();
}());
</script>
</body>
</html>
