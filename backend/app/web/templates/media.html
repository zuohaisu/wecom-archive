<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>媒体与附件</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/console/media-viewer.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/media-library.css?v=__STATIC_VERSION__">
<style>
.media-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:var(--space-4)}.media-card{position:relative;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-1);transition:transform .15s ease,box-shadow .15s ease}.media-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-2)}.media-thumb{height:148px;display:flex;align-items:center;justify-content:center;position:relative;background:var(--color-surface-sunken);color:var(--color-text-4);overflow:hidden}.media-thumb img{width:100%;height:100%;object-fit:cover}.media-kind{position:absolute;top:8px;left:8px;z-index:1}.media-body{padding:10px 12px}.media-name,.media-session{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.media-name{font-weight:600}.media-session,.media-meta{font-size:var(--text-xs);color:var(--color-text-4);margin-top:4px}.media-footer{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-top:1px solid var(--color-border);font-size:var(--text-xs);color:var(--color-text-4)}.media-preview{display:block;width:100%;padding:0;border:0;background:none;color:inherit;text-decoration:none;cursor:zoom-in;text-align:inherit}.media-status{min-height:1.3em}.hidden{display:none!important}@media(max-width:900px){.side-nav{display:none}.page{padding:var(--space-4)}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="media.breadcrumbData">数据</span><span class="sep">/</span><span class="cur" data-i18n="media.pageTitle">媒体与附件</span></div></header>
  <main class="page">
    <div class="page-hd"><div><h1 data-i18n="media.pageTitle">媒体与附件</h1><p data-i18n="media.description">浏览归档会话中的图片、文件、语音与视频。</p></div><button class="btn btn-secondary media-select-mode" id="media-select-mode" type="button" aria-pressed="false" data-i18n="media.enterSelection">选择媒体</button></div>
    <div class="toolbar toolbar-compact">
      <div class="search-input"><span class="ico">⌕</span><input class="input" id="media-search" type="search" data-i18n-placeholder="media.searchPlaceholder" placeholder="搜索文件名"></div>
      <select class="select" id="media-type"><option value="" data-i18n="media.allTypes">全部类型</option><option value="image" data-i18n="media.type.image">图片</option><option value="file" data-i18n="media.type.file">文件</option><option value="voice" data-i18n="media.type.voice">语音</option><option value="video" data-i18n="media.type.video">视频</option></select>
      <select class="select" id="media-days"><option value="" data-i18n="media.allTime">全部时间</option><option value="7" data-i18n="media.days7">近 7 天</option><option value="30" data-i18n="media.days30">近 30 天</option><option value="90" data-i18n="media.days90">近 90 天</option></select>
      <select class="select" id="media-sort"><option value="newest" data-i18n="media.sortNewest">最新在前</option><option value="oldest" data-i18n="media.sortOldest">最早在前</option><option value="size_desc" data-i18n="media.sortLargest">体积从大到小</option></select>
      <label class="media-favorites-only" for="media-favorited-only"><input type="checkbox" id="media-favorited-only"><span data-i18n="media.favoritesOnly">仅看已收藏</span></label>
    </div>
    <div class="media-selection-toolbar hidden" id="media-selection-toolbar" role="region" aria-labelledby="media-selection-count">
      <span class="media-selection-count" id="media-selection-count" role="status" aria-live="polite" data-i18n="media.selectedCount">已选 {n} 项</span>
      <button class="btn btn-secondary" id="media-select-all" type="button" data-i18n="media.selectAllLoaded">全选当前已加载</button>
      <button class="btn btn-secondary" id="media-clear-selection" type="button" data-i18n="media.clearSelection">清空选择</button>
      <button class="btn btn-primary" id="media-favorite-selected" type="button" data-i18n="media.favoriteSelected">收藏</button>
      <button class="btn btn-secondary" id="media-unfavorite-selected" type="button" data-i18n="media.unfavoriteSelected">取消收藏</button>
      <p class="field-help media-selection-hint" id="media-selection-hint" aria-live="polite"></p>
    </div>
    <div class="media-action-result"><p id="media-favorite-status" class="field-help media-status" role="status" aria-live="polite"></p><a id="media-favorites-link" class="hidden" href="/admin/favorites" data-i18n="media.viewFavorites">查看收藏夹</a></div>
    <p id="media-status" class="field-help media-status" role="status" aria-live="polite"></p>
    <section id="media-grid" class="media-grid" aria-live="polite" aria-busy="false"></section>
    <div class="row gap-3 mt-6" style="justify-content:center"><button class="btn hidden" id="media-more" type="button" data-i18n="media.loadMore">加载更多</button><span class="muted" id="media-count"></span></div>
  </main>
</div></div>
<script src="/web/static/product-analytics.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/console/media-viewer.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/media-favorites.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/media-library.js?v=__STATIC_VERSION__"></script>
</body>
</html>
