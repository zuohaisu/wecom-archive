<!doctype html>
<html lang="zh-CN" data-plane="platform">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>基础设施 — 平台运营控制台</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/platform-operations.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/platform-console-orange.css?v=__STATIC_VERSION__">
</head>
<body>
__ADMIN_BAR__
<div class="shell">
__SIDENAV__
<div class="main">
__TOPBAR__
<main class="page">
  <div class="page-hd">
    <div><h1>基础设施</h1><p>租户凭据连通性、托管品牌域名与 TLS 证书状态、企业微信第三方应用渠道健康度。</p></div>
  </div>
  <div id="error" class="alert alert-danger" role="alert" hidden></div>

  <div class="tabs" role="tablist">
    <button class="tab active" type="button" role="tab" data-tab="conn" aria-selected="true">连通性</button>
    <button class="tab" type="button" role="tab" data-tab="domains" aria-selected="false">品牌域名 / TLS</button>
    <button class="tab" type="button" role="tab" data-tab="provider" aria-selected="false">渠道（WeCom）</button>
  </div>

  <section id="panel-conn">
    <div class="card">
      <div class="card-hd">
        <div><h2>租户凭据连通性</h2><span class="muted" id="conn-summary">—</span></div>
        <button class="btn btn-sm" type="button" id="conn-recheck-all">批量重新检查</button>
      </div>
      <div class="card-bd table-wrap">
        <table>
          <thead><tr><th>租户</th><th>结果</th><th>失败原因</th><th>最近检查</th><th>回调域名</th><th>操作</th></tr></thead>
          <tbody id="conn-rows"></tbody>
        </table>
      </div>
      <div class="card-ft">重新检查为只读探测，非受控操作；不回显凭据，不记录密钥。</div>
    </div>
  </section>

  <section id="panel-domains" hidden>
    <section class="metric-grid" aria-label="域名与证书指标">
      <article class="card metric"><span>域名总数</span><strong id="domain-total">—</strong><small id="domain-enabled-disabled">—</small></article>
      <article class="card metric"><span>证书已签发</span><strong id="cert-issued">—</strong><small id="cert-other">—</small></article>
      <article class="card metric metric-alert"><span>30 天内到期</span><strong id="cert-expiring">—</strong><small>需人工跟进</small></article>
      <article class="card metric"><span>失败 / 绑定异常</span><strong id="cert-failed">—</strong><small id="cert-invalid-binding">—</small></article>
    </section>
    <div class="card">
      <div class="card-hd">
        <div><h2>托管 TLS 域名</h2><span class="muted" id="domain-pagination">—</span></div>
        <div class="segmented" id="domain-sort">
          <button type="button" class="active" data-sort="expires">到期时间</button>
          <button type="button" data-sort="hostname">域名</button>
          <button type="button" data-sort="status">状态</button>
        </div>
      </div>
      <div class="card-bd table-wrap">
        <table>
          <thead><tr><th>域名</th><th>租户</th><th>域名状态</th><th>启用</th><th>证书状态</th><th>证书到期</th><th>最近检查</th></tr></thead>
          <tbody id="domain-rows"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="panel-provider" hidden>
    <div class="platform-grid">
      <section class="card">
        <div class="card-hd"><h2>suite_ticket 状态</h2></div>
        <div class="card-bd" id="suite-ticket-body"></div>
      </section>
      <section class="card">
        <div class="card-hd"><h2>渠道回调与配置</h2></div>
        <div class="card-bd" id="provider-config-body"></div>
      </section>
    </div>
  </section>
</main>
</div>
</div>
<script src="/web/static/platform-console.js?v=__STATIC_VERSION__"></script>
<script src="/web/static/platform-infra.js?v=__STATIC_VERSION__"></script>
</body>
</html>
