<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>设置</title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="icon" href="/web/static/brand/favicon.ico?v=__STATIC_VERSION__" sizes="any">
<link rel="apple-touch-icon" href="/web/static/brand/apple-touch-icon.png?v=__STATIC_VERSION__">
<link rel="mask-icon" href="/web/static/brand/logo-icon-mono.svg?v=__STATIC_VERSION__" color="#1F5CC4">
<link rel="manifest" href="/web/static/site.webmanifest?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.settings-layout{display:flex;align-items:flex-start;gap:var(--space-5)}
.settings-nav{width:160px;flex-shrink:0;position:sticky;top:var(--space-4)}
.settings-nav-item{justify-content:flex-start;width:100%}
.settings-sections{flex:1;min-width:0}
.set-row{display:flex;gap:var(--space-5);padding:var(--space-4) var(--space-5);align-items:flex-start}
.set-label{width:200px;flex-shrink:0}
.set-label h3{font-size:var(--text-md);margin-bottom:2px}
.set-label p{font-size:var(--text-xs);color:var(--color-text-4);line-height:var(--leading-loose)}
.set-ctl{flex:1;min-width:0;max-width:420px}
@media (max-width:900px){.page{padding:var(--space-4)}}
@media (max-width:720px){.settings-layout{flex-direction:column}.settings-nav{position:static;width:100%;flex-direction:row;flex-wrap:wrap}.settings-nav-item{width:auto}}
@media (max-width:640px){.side-nav{display:none}.set-row{flex-direction:column}.set-label{width:auto}.set-ctl{width:100%}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="nav.group.system">系统</span><span class="sep">/</span><span class="cur" data-i18n="nav.settings">设置</span></div></header>
<main class="page page-narrow settings-page">
  <div class="page-hd">
    <div>
      <h1>设置</h1>
      <p>账号安全设置。</p>
    </div>
  </div>

  <div class="settings-layout">
    <nav class="settings-nav stack gap-2" aria-label="设置分组" role="tablist">
      <button class="btn btn-ghost settings-nav-item" type="button" role="tab" aria-selected="false" aria-controls="settings-section-general" data-settings-section="general" data-i18n="settings.group.general">通用</button>
      <button class="btn btn-ghost settings-nav-item active" type="button" role="tab" aria-selected="true" aria-controls="settings-section-account" data-settings-section="account">账号</button>
      <button class="btn btn-ghost settings-nav-item" type="button" role="tab" aria-selected="false" aria-controls="settings-section-third-party" data-settings-section="third-party" data-i18n="settings.group.thirdParty">第三方</button>
      <button class="btn btn-ghost settings-nav-item" type="button" role="tab" aria-selected="false" aria-controls="settings-section-storage" data-settings-section="storage" data-i18n="settings.group.storage">存储</button>
      <button class="btn btn-ghost settings-nav-item" type="button" role="tab" aria-selected="false" aria-controls="settings-section-wecom" data-settings-section="wecom" data-i18n="settings.group.wecom">企微</button>
      <button class="btn btn-ghost settings-nav-item" type="button" role="tab" aria-selected="false" aria-controls="settings-section-advanced" data-settings-section="advanced" data-i18n="settings.group.advanced">高级</button>
    </nav>

    <div class="settings-sections">
      <section id="settings-section-general" class="settings-section" role="tabpanel" aria-label="通用" hidden>
        <div class="card"><div class="card-hd"><h2 data-i18n="settings.group.general">通用</h2></div><div class="card-bd"><p class="field-help">配置项加载中…</p></div></div>
      </section>
      <div id="settings-section-account" class="settings-section" role="tabpanel" aria-label="账号">
  <section class="card">
    <div class="card-hd"><h2>账号</h2></div>
    <div class="set-row">
      <div class="set-label">
        <h3 data-i18n="settings.securityActivity.title">安全与活动</h3>
        <p data-i18n="settings.securityActivity.description">查看重要的账号和安全活动记录。</p>
      </div>
      <div class="set-ctl"><a class="btn" href="/admin/audit-logs" data-i18n="settings.securityActivity.open">查看安全与活动</a><p class="field-help" data-i18n="settings.securityActivity.readOnly">仅可查看，无法在此修改活动记录。</p></div>
    </div>
    <div class="set-row">
      <div class="set-label">
        <h3>修改密码</h3>
        <p>仅影响账号密码登录方式；企业微信授权登录不受影响。</p>
      </div>
      <form id="change-password-form" class="set-ctl" novalidate>
        <div class="field">
          <label class="field-label" for="old-password">当前密码</label>
          <input class="input" id="old-password" name="old_password" type="password" autocomplete="current-password" required>
        </div>
        <div class="field">
          <label class="field-label" for="new-password">新密码</label>
          <input class="input" id="new-password" name="new_password" type="password" autocomplete="new-password" required>
          <span class="field-help">至少 8 位。</span>
        </div>
        <div class="field">
          <label class="field-label" for="confirm-new-password">确认新密码</label>
          <input class="input" id="confirm-new-password" type="password" autocomplete="new-password" required>
        </div>
        <p id="change-password-message" class="field-help" role="status" aria-live="polite"></p>
        <button class="btn btn-primary" id="update-password-button" type="submit">更新密码</button>
      </form>
    </div>
  </section>
      </div>
      <section id="settings-section-third-party" class="settings-section" role="tabpanel" aria-label="第三方" hidden>
        <div class="card"><div class="card-hd"><h2 data-i18n="settings.group.thirdParty">第三方</h2></div><div class="card-bd"><p class="field-help">配置项加载中…</p></div></div>
      </section>
      <section id="settings-section-storage" class="settings-section" role="tabpanel" aria-label="存储" hidden>
        <div class="card"><div class="card-hd"><h2 data-i18n="settings.group.storage">存储</h2></div><div class="card-bd"><p class="field-help">配置项加载中…</p></div></div>
      </section>
      <section id="settings-section-wecom" class="settings-section" role="tabpanel" aria-label="企微" hidden>
        <div class="card"><div class="card-hd"><h2 data-i18n="settings.group.wecom">企微</h2></div><div class="card-bd"><p class="field-help">配置项加载中…</p></div></div>
      </section>
      <section id="settings-section-advanced" class="settings-section" role="tabpanel" aria-label="高级" hidden>
        <div class="card"><div class="card-hd"><h2 data-i18n="settings.group.advanced">高级</h2></div><div class="card-bd"><p class="field-help">配置项加载中…</p></div></div>
      </section>
    </div>
  </div>
</main>
</div></div>
<script src="/web/static/settings.js?v=__STATIC_VERSION__"></script>
<script>
(function () {
  var form = document.getElementById('change-password-form');
  var message = document.getElementById('change-password-message');
  var button = document.getElementById('update-password-button');

  function showMessage(text, isError) {
    message.textContent = text;
    message.className = isError ? 'field-error' : 'field-help';
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    var oldPassword = document.getElementById('old-password').value;
    var newPassword = document.getElementById('new-password').value;
    var confirmation = document.getElementById('confirm-new-password').value;

    if (newPassword.length < 8) {
      showMessage('新密码至少需要 8 位。', true);
      return;
    }
    if (newPassword !== confirmation) {
      showMessage('两次输入的新密码不一致。', true);
      return;
    }

    button.disabled = true;
    showMessage('', false);
    fetch('/api/admin/settings/password', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      credentials: 'include',
      body: JSON.stringify({old_password: oldPassword, new_password: newPassword})
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (body) {
        return {response: response, body: body};
      });
    }).then(function (result) {
      if (result.response.status === 200) {
        form.reset();
        showMessage('密码更新成功。', false);
        return;
      }
      var messages = {
        weak_password: '新密码至少需要 8 位。',
        same_as_old: '新密码不能与当前密码相同。',
        no_password_set: '当前账号未设置密码，无法在此修改。',
        invalid_old_password: '当前密码不正确。'
      };
      showMessage(messages[result.body.detail] || '密码更新失败，请稍后重试。', true);
    }).catch(function () {
      showMessage('网络错误，请稍后重试。', true);
    }).finally(function () {
      button.disabled = false;
    });
  });
}());
</script>
<script>
(function () {
  function langMenu() {
    var menu = document.getElementById('lang-menu');
    if (!menu) return;
    menu.textContent = '';
    I18N.availableLocales().forEach(function (locale) {
      var option = document.createElement('div');
      option.className = 'lang-option' + (locale.code === I18N.getLocale() ? ' active' : '');
      option.dataset.locale = locale.code;
      option.textContent = locale.nativeName;
      menu.appendChild(option);
    });
  }
  window.toggleLangMenu = function () {
    var menu = document.getElementById('lang-menu');
    if (!menu) return;
    menu.style.display = menu.style.display === 'none' ? 'block' : 'none';
    langMenu();
  };
  window.doLogout = function () {
    fetch('/api/auth/logout', {method: 'POST', credentials: 'include'})
      .finally(function () { window.location = '/admin/login'; });
  };
  document.addEventListener('click', function (event) {
    var option = event.target.closest('.lang-option');
    if (!option) return;
    I18N.setLocale(option.dataset.locale);
    document.getElementById('lang-menu').style.display = 'none';
  });
  I18N.onChange(langMenu);
  langMenu();
}());
</script>
</body>
</html>
