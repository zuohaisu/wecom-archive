<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title data-i18n="activation.pageTitle">开通进度</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<style>
.activation-hero{display:flex;gap:var(--space-4);align-items:flex-start;padding:var(--space-5) var(--space-5) var(--space-4)}
.activation-hero .act-icon{font-size:28px;line-height:1;width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 48px}
.activation-hero[data-state="active"] .act-icon{background:var(--color-success-bg, rgba(25,163,87,.12));color:var(--color-success, #19a357)}
.activation-hero[data-state="ready"] .act-icon{background:rgba(50,125,255,.12);color:#327dff}
.activation-hero[data-state="blocked"] .act-icon{background:rgba(255,125,50,.12);color:#ff7d32}
.activation-hero[data-state="not_started"] .act-icon{background:var(--color-bg-3);color:var(--color-text-4)}
.activation-hero h2{margin:0 0 4px;font-size:var(--text-lg)}
.activation-hero p{margin:0;color:var(--color-text-3);font-size:var(--text-sm)}
.activation-actions{display:flex;gap:var(--space-2);flex-wrap:wrap;padding:0 var(--space-5) var(--space-5)}
.activation-gates{display:grid;gap:var(--space-2);margin:0 var(--space-5) var(--space-4)}
.gate-chip{display:flex;gap:var(--space-2);align-items:center;justify-content:space-between;border:1px solid var(--color-border);border-radius:var(--radius-md);padding:10px 14px;font-size:var(--text-sm)}
.gate-chip .gate-name{color:var(--color-text-2)}
.gate-chip .gate-status{white-space:nowrap}
.gate-chip[data-ok="true"]{background:rgba(25,163,87,.05);border-color:rgba(25,163,87,.35)}
.gate-chip[data-ok="false"]{background:rgba(255,125,50,.05);border-color:rgba(255,125,50,.4)}
.gate-chip[data-skipped="true"]{opacity:.65}
.gate-chip .gate-safe-error{color:var(--color-text-4);font-size:var(--text-xs);margin-top:2px}
.activation-foot{padding:0 var(--space-5) var(--space-5);color:var(--color-text-4);font-size:var(--text-sm)}
@media(max-width:640px){.page{padding:var(--space-4)}}
</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="provisioning.settings.crumb">开通步骤</span><span class="sep">/</span><span class="cur" data-i18n="activation.pageTitle">开通进度</span></div></header>
  <main class="page page-narrow">
    <div class="page-hd">
      <div><h1 data-i18n="activation.pageTitle">开通进度</h1><p data-i18n="activation.pageDescription">系统会自动检查归档配置与订阅状态，全部通过后自动开通，无需人工激活。</p></div>
    </div>
    <section id="activation-root" aria-live="polite" aria-atomic="true" aria-busy="true"><p class="diag-loading" data-i18n="activation.loading">正在检查开通状态…</p></section>
  </main>
</div></div>
<script src="/web/static/provisioning.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.textContent='';I18N.availableLocales().forEach(function(locale){var option=document.createElement('div');option.className='lang-option'+(locale.code===I18N.getLocale()?' active':'');option.dataset.locale=locale.code;option.textContent=locale.nativeName;menu.appendChild(option);});}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};
  window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});
  I18N.onChange(langMenu);langMenu();
}());
</script>
</body>
</html>
