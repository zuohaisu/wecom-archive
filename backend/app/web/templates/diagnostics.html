<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="icon" href="/web/static/brand/favicon.ico?v=__STATIC_VERSION__" sizes="any">
<link rel="apple-touch-icon" href="/web/static/brand/apple-touch-icon.png?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/diagnostics.css?v=__STATIC_VERSION__">
<style>@media(max-width:900px){.page{padding:var(--space-4)}}@media(max-width:640px){.side-nav{display:none}}</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="nav.group.system">系统</span><span class="sep">/</span><span class="cur" data-i18n="diagnostics.pageTitle">消息可查阅性</span></div></header>
  <main class="page page-narrow">
    <div class="page-hd">
      <div><h1 data-i18n="diagnostics.pageTitle">消息可查阅性</h1><p data-i18n="diagnostics.pageDescription">确认归档消息能否在对应员工、联系人和群聊中被正常找到。</p></div>
    </div>
    <section class="diag-explainer" aria-labelledby="diag-explainer-title">
      <div><span class="badge badge-info" data-i18n="diagnostics.explainer.eyebrow">这项检查做什么</span><h2 id="diag-explainer-title" data-i18n="diagnostics.explainer.title">检查消息是否可被正确找到</h2></div>
      <div class="diag-explainer-grid">
        <p data-i18n="diagnostics.explainer.scope">检查近期已解密消息与员工、联系人、群聊的关联是否完整。</p>
        <p data-i18n="diagnostics.explainer.result">页面直接显示上一次完整结果；重新检查时旧结果仍然保留。</p>
        <p data-i18n="diagnostics.explainer.excludes">不检查企业微信连接、同步速度或存储容量，这些状态请在总览与设置中查看。</p>
      </div>
    </section>
    <section id="diag-root" aria-live="polite" aria-atomic="true" aria-busy="true"><p class="diag-loading" data-i18n="diagnostics.loading">正在加载最近检查结果…</p></section>
  </main>
</div></div>
<script src="/web/static/diagnostics.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.textContent='';I18N.availableLocales().forEach(function(locale){var option=document.createElement('div');option.className='lang-option'+(locale.code===I18N.getLocale()?' active':'');option.dataset.locale=locale.code;option.textContent=locale.nativeName;menu.appendChild(option);});}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};
  window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});
  I18N.onChange(langMenu);langMenu();
}());
</script>
</body>
</html>
