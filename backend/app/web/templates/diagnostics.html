<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title></title>
<link rel="icon" href="/web/static/brand/favicon.svg?v=__STATIC_VERSION__" type="image/svg+xml">
<link rel="icon" href="/web/static/brand/favicon.ico?v=__STATIC_VERSION__" sizes="any">
<link rel="apple-touch-icon" href="/web/static/brand/apple-touch-icon.png?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/diagnostics.css?v=__STATIC_VERSION__">
<style>@media(max-width:900px){.side-nav{display:none}.page{padding:var(--space-4)}}</style>
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="nav.group.system">系统</span><span class="sep">/</span><span class="cur" data-i18n="diagnostics.pageTitle">消息可达性诊断</span></div></header>
  <main class="page">
    <div class="page-hd">
      <div><h1 data-i18n="diagnostics.pageTitle">消息可达性诊断</h1><p data-i18n="diagnostics.pageDescription">本页仅展示消息可达性审计的聚合统计数据，不包含消息内容或原始标识符。</p></div>
      <div class="page-hd-actions"><button class="btn" id="btn-diag-refresh" type="button" data-i18n="diagnostics.refresh">刷新</button></div>
    </div>
    <div id="diag-root"><div class="diag-loading" data-i18n="diagnostics.loading">正在加载诊断数据…</div></div>
  </main>
</div></div>
<script src="/web/static/diagnostics.js?v=__STATIC_VERSION__"></script>
<script>
(function(){
  function langMenu(){var menu=document.getElementById('lang-menu');if(menu)menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};
  window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});
  I18N.onChange(langMenu);langMenu();
}());
</script>
</body>
</html>
