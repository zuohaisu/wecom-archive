<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>帮助与客服</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="manifest" href="/api/branding/manifest.webmanifest">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/support.css?v=__STATIC_VERSION__">
</head>
<body>
__I18N_SCRIPT__
<div class="shell">
__SIDENAV__
<div class="main">
  <header class="topbar"><div class="breadcrumb"><span data-i18n="support.breadcrumbHelp">帮助</span><span class="sep">/</span><span class="cur" data-i18n="support.pageTitle">帮助与客服</span></div></header>
  <main class="page support-page">
    <div class="page-hd">
      <div>
        <h1 data-i18n="support.pageTitle">帮助与客服</h1>
        <p data-i18n="support.description">提交使用问题、Bug 或产品建议，反馈会直接发送到我们的客服邮箱。</p>
      </div>
    </div>

    <div id="support-feedback-panel" role="main">
      <form id="feedback-form" class="feedback-form">
        <p data-i18n="support.feedbackIntro">我们会认真阅读每一条反馈并尽快回复，感谢你的帮助。</p>
        <label for="feedback-type" data-i18n="support.feedbackTypeLabel">反馈类型</label>
        <select id="feedback-type" class="select">
          <option value="question" data-i18n="support.feedbackType.question">使用问题</option>
          <option value="bug" data-i18n="support.feedbackType.bug">Bug / 异常</option>
          <option value="suggestion" data-i18n="support.feedbackType.suggestion">产品建议</option>
          <option value="other" data-i18n="support.feedbackType.other">其他</option>
        </select>
        <label for="feedback-body" data-i18n="support.feedbackBodyLabel">反馈内容</label>
        <textarea id="feedback-body" class="input" rows="6" required></textarea>
        <label for="feedback-contact" data-i18n="support.feedbackContactLabel">联系方式（可选）</label>
        <input id="feedback-contact" class="input" type="text">
        <button type="submit" class="btn btn-primary" data-i18n="support.feedbackSubmit">提交反馈</button>
        <p id="feedback-status" class="field-help" role="status" aria-live="polite"></p>
      </form>
    </div>
  </main>
</div></div>

<script>
(function () {
  'use strict';
  function t(key){var value=I18N.t(key);return value===key?key:value;}
  function translate(){document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});document.title=t('support.pageTitle');}
  function setStatus(text){document.getElementById('feedback-status').textContent=text;}
  function langMenu(){var menu=document.getElementById('lang-menu');if(!menu)return;menu.innerHTML=I18N.availableLocales().map(function(locale){return '<div class="lang-option '+(locale.code===I18N.getLocale()?'active':'')+'" data-locale="'+locale.code+'">'+locale.nativeName+'</div>';}).join('');}
  window.toggleLangMenu=function(){var menu=document.getElementById('lang-menu');menu.style.display=menu.style.display==='none'?'block':'none';langMenu();};
  window.doLogout=function(){fetch('/api/auth/logout',{method:'POST',credentials:'include'}).finally(function(){window.location='/admin/login';});};
  document.getElementById('feedback-form').addEventListener('submit',function(event){
    event.preventDefault();
    var body=document.getElementById('feedback-body').value.trim();
    if(!body)return;
    setStatus(t('support.feedbackSubmitting'));
    fetch('/api/ai/support/feedback',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({feedback_type:document.getElementById('feedback-type').value,body:body,contact:document.getElementById('feedback-contact').value||null})})
      .then(function(response){if(!response.ok)throw new Error('feedback_failed');return response.json();})
      .then(function(){setStatus(t('support.feedbackSubmitted'));document.getElementById('feedback-form').reset();})
      .catch(function(){setStatus(t('support.networkError'));});
  });
  document.addEventListener('click',function(event){var option=event.target.closest('.lang-option');if(option){I18N.setLocale(option.dataset.locale);document.getElementById('lang-menu').style.display='none';}});
  I18N.onChange(function(){translate();langMenu();});translate();langMenu();
}());
</script>
</body>
</html>
