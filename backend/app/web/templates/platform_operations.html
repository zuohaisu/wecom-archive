<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>平台运营看板</title>
<link rel="icon" href="/api/branding/favicon" sizes="any">
<link rel="stylesheet" href="/web/static/design-system.css?v=__STATIC_VERSION__">
<link rel="stylesheet" href="/web/static/platform-operations.css?v=__STATIC_VERSION__">
</head>
<body>
<header class="platform-header"><div><strong>365 Archive</strong><span>平台运营</span></div><small>仅限内部平台管理员 · 不展示聊天内容</small></header>
<main class="platform-page">
  <div class="page-hd"><div><h1>运营看板</h1><p>跨租户规模、用量、订阅和收入摘要。</p></div><button id="refresh" class="btn btn-primary" type="button">刷新数据</button></div>
  <div id="error" class="alert alert-danger" role="alert" hidden></div>
  <section class="metric-grid" aria-label="核心指标">
    <article class="card metric"><span>租户总数</span><strong id="tenant-total">—</strong><small id="tenant-states">—</small></article>
    <article class="card metric"><span>管理员账号</span><strong id="admin-accounts">—</strong><small id="observed-users">—</small></article>
    <article class="card metric"><span>消息总数</span><strong id="message-total">—</strong><small>仅汇总，不展示内容</small></article>
    <article class="card metric"><span>媒体与存储</span><strong id="storage-total">—</strong><small id="media-total">—</small></article>
    <article class="card metric"><span>收款</span><strong id="receipt-total">—</strong><small id="net-revenue">—</small></article>
    <article class="card metric"><span>退款</span><strong id="refund-total">—</strong><small>收入按 CNY 汇总</small></article>
  </section>
  <div class="platform-grid">
    <section class="card"><div class="card-hd"><h2>套餐 / 订阅分布</h2></div><div class="card-bd"><ul id="subscriptions" class="summary-list"></ul></div></section>
    <section class="card"><div class="card-hd"><h2>接近或超过存储配额</h2></div><div class="card-bd"><ul id="quota-risks" class="summary-list"></ul></div></section>
    <section class="card"><div class="card-hd"><h2>最近新增租户</h2></div><div class="card-bd"><ul id="recent-tenants" class="summary-list"></ul></div></section>
    <section class="card"><div class="card-hd"><h2>最近活跃租户</h2></div><div class="card-bd"><ul id="recent-active" class="summary-list"></ul></div></section>
  </div>
  <section class="card"><div class="card-hd"><h2>收款、退款与净收入（月）</h2></div><div class="card-bd table-wrap"><table><thead><tr><th>周期</th><th>收款</th><th>退款</th><th>净收入</th></tr></thead><tbody id="revenue-periods"></tbody></table></div></section>
  <section class="card tenant-card"><div class="card-hd"><h2>租户列表</h2><span id="tenant-pagination" class="muted"></span></div><div class="card-bd table-wrap"><table><thead><tr><th>租户</th><th>服务</th><th>套餐 / 到期</th><th>管理员</th><th>消息</th><th>媒体 / 存储</th><th>操作</th></tr></thead><tbody id="tenant-rows"></tbody></table><div class="pager"><button id="previous-page" class="btn" type="button">上一页</button><button id="next-page" class="btn" type="button">下一页</button></div></div></section>
  <aside id="tenant-detail" class="card tenant-detail" hidden aria-live="polite"></aside>
</main>
<script src="/web/static/platform-operations.js?v=__STATIC_VERSION__"></script>
</body>
</html>
