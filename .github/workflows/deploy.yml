name: CD - Deploy to Production

# CD-only workflow. Full CI runs on the pull request (and merge queue, when
# enabled) and must pass before the maintainer merges. Direct pushes to main
# are prohibited by project policy; otherwise an untested commit could reach
# this workflow. Enable platform-enforced branch protection when available.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '.qoder/**'
      - '.workbuddy/**'
      - '.trae/**'
      - '.hermes/**'
      - 'docs/**'
      - 'tasks/**'
      - '*.md'

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # QA round 2 finding: without this, two workflow runs (e.g. two rapid
    # pushes to main) could both reach this job and SSH in concurrently,
    # racing deploy_server.sh's own PREV_SHA capture / restart / last-
    # known-good bookkeeping against each other. `cancel-in-progress:
    # false` queues a second run rather than cancelling a deploy that's
    # already mid-flight (never kill a deploy partway through). This is
    # the primary serialization guarantee; deploy_server.sh's own flock
    # (docs/DEPLOYMENT.md §7.1) is defense-in-depth for invocations
    # outside GitHub Actions' visibility (e.g. a manual SSH run).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      # QA round 2 fix: the fetch/checkout-to-EXPECTED_SHA step and the
      # invocation of deploy_server.sh are ONE SSH session/script block
      # (not two separate steps) specifically so PREV_SHA, captured
      # before the checkout, stays in the same shell's environment when
      # deploy_server.sh runs — two separate appleboy/ssh-action steps
      # would be two independent SSH connections with no shared shell
      # state between them.
      #
      # Why the checkout happens HERE, in the workflow YAML, rather than
      # solely inside scripts/deploy_server.sh: this workflow file is
      # always evaluated at github.sha itself (GitHub Actions reads
      # `push`-triggered workflows from the commit that triggered them),
      # so this script block is ALWAYS fresh — unlike the copy of
      # deploy_server.sh already sitting on the server from the
      # previous release, which cannot know about logic added in THIS
      # commit until something checks that commit out. Doing the
      # checkout here means the very deploy that ships a change to
      # deploy_server.sh's own logic already runs that new logic,
      # instead of only taking effect starting with the next deploy.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            cd /srv/apps/wecom-archive-365/current

            # QA round 3 fix: the lock MUST be acquired before the
            # checkout below, not after (inside deploy_server.sh, as an
            # earlier version of this workflow had it) -- otherwise a
            # concurrent manual deploy already mid-flight (holding this
            # same lock) would still have its working tree silently
            # swapped out from under it by this checkout before this
            # script ever finds out the lock is held. DEPLOY_LOCK_FILE
            # must match scripts/deploy_server.sh's own
            # $DEPLOY_STATE_DIR/deploy.lock exactly.
            DEPLOY_LOCK_FILE=/srv/apps/wecom-archive-365/shared/deploy_state/deploy.lock
            mkdir -p "$(dirname "$DEPLOY_LOCK_FILE")"
            exec 9>"$DEPLOY_LOCK_FILE"
            if ! flock -n 9; then
              echo "ERROR: another deploy is already in progress (lock held on $DEPLOY_LOCK_FILE). Refusing to run concurrently." >&2
              exit 1
            fi

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: working tree has uncommitted changes; refusing to checkout." >&2
              exit 1
            fi
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Previous commit: $PREV_SHA"
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$PREV_SHA" "$EXPECTED_SHA"; then
              echo "ERROR: EXPECTED_SHA ($EXPECTED_SHA) is not a fast-forward from $PREV_SHA." >&2
              exit 1
            fi

            # GH-121: inspect the target revision's complete tree against
            # current untracked paths before checkout. Read the helper from
            # EXPECTED_SHA itself so this check protects the very deployment
            # that introduces or changes it; the on-disk copy is still from
            # PREV_SHA at this point. The helper only reports collisions --
            # it never reads artifact contents or moves/deletes/cleans/reset
            # any production path. Git checkout below remains the final
            # safety backstop for filesystem races after this preflight.
            if ! git show "$EXPECTED_SHA:scripts/deploy_preflight.sh" | bash -c 'source /dev/stdin; deploy_preflight_check_untracked_collisions "$1"' -- "$EXPECTED_SHA"; then
              exit 1
            fi

            git checkout -B main "$EXPECTED_SHA"
            echo "Checked out: $(git rev-parse HEAD)"

            # From here on, this IS the freshly-checked-out
            # deploy_server.sh -- fd 9 (and the flock on it, acquired
            # above) is inherited by this child process automatically;
            # DEPLOY_LOCK_ALREADY_HELD=1 tells it not to re-open fd 9
            # itself, which would create a second, distinct open file
            # description and self-deadlock against the lock this
            # script is still holding. PREV_SHA and EXPECTED_SHA are both
            # already in this shell's environment, so the script skips
            # its own (redundant) checkout and uses them directly.
            export PREV_SHA
            export DEPLOY_LOCK_ALREADY_HELD=1
            bash scripts/deploy_server.sh
