name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  test:
    name: CI Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: wecom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Bats (deploy_server.sh integration tests)
        run: sudo apt-get update -qq && sudo apt-get install -yqq bats shellcheck

      - name: Install Python dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff

      - name: Configure Git identity
        run: |
          git config user.name "CI"
          git config user.email "ci@localhost"
        # Required by test_makefile_lint_diff.py which runs git commit

      # ── Gate 1: compile check ──────────────────────────────────
      - name: "[GATE] Compile-check Python code"
        run: |
          cd backend
          echo "=== app ==="
          python -m compileall -q app \
            || { echo "::error ::Compile failed in app/"; exit 1; }
          echo "=== scripts ==="
          python -m compileall -q scripts \
            || { echo "::error ::Compile failed in scripts/"; exit 1; }
          echo "=== tests ==="
          python -m compileall -q tests \
            || { echo "::error ::Compile failed in tests/"; exit 1; }
          echo "Compile check passed."

      # ── Gate 2: app import check ───────────────────────────────
      - name: "[GATE] App import check"
        run: |
          cd backend
          python -c "
          import os
          os.environ['DATABASE_URL'] = 'sqlite:///:memory:'
          from app.main import app
          print(f'App import successful ({len(app.routes)} routes)')
          "

      # ── Gate 3: deploy script safety (RND-227 P0-G) ────────────
      # Runs the REAL scripts/deploy_server.sh end to end against mocked
      # git/python/systemctl/curl (scripts/tests/test_helper/mock_*.sh) —
      # never a real server. Was previously only run locally by hand;
      # QA round 1 flagged that as a gap (a regression here could land
      # on main undetected until an actual production deploy failed).
      - name: "[GATE] Shellcheck deploy scripts"
        run: shellcheck scripts/deploy_server.sh scripts/tests/test_helper/*.sh

      - name: "[GATE] deploy_server.sh integration tests (bats)"
        run: bats scripts/tests/deploy_server.bats

      # ── Round 1: offline / SQLite-compatible tests ─────────────
      - name: "Offline / SQLite-compatible tests"
        run: |
          cd backend
          echo "=========================================="
          echo "  Offline & SQLite-compatible Tests"
          echo "  (no PostgreSQL required)"
          echo "=========================================="
          echo ""
          python -m pytest tests/ -q -rs \
            --tb=short \
            --durations=10 \
            -p no:warnings
          echo ""
          echo "Offline/SQLite tests passed."
        env:
          BACKEND_PY: python
        # DATABASE_URL intentionally unset:
        #   - SQLite & mock tests create their own engines
        #   - PG-only tests self-skip: _postgres_reachable() checks a
        #     Unix-socket PG that does not exist on the runner
        #   - tenant_foundation & auth DB tests self-skip:
        #     _DB_AVAILABLE is False when DATABASE_URL is unset

      # ── Round 2: PostgreSQL-specific tests ─────────────────────
      - name: "[GATE] Run database migrations (alembic upgrade head)"
        run: |
          cd backend
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wecom_test

      # RND-227 P0-F: schema-drift gate. Must run AFTER upgrade head (a
      # pending-migrations problem and an ORM/DB drift problem are
      # different failures — this isolates the second one) and BEFORE
      # the test suite, so a drifting model fails fast instead of
      # masquerading as a random downstream test failure. Uses the same
      # disposable CI Postgres service as every other PG-gated step
      # here — never production.
      - name: "[GATE] Alembic schema-drift check (ORM metadata vs migrations)"
        run: |
          cd backend
          python -m alembic check
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wecom_test

      - name: "PostgreSQL-specific tests"
        run: |
          cd backend
          echo "=========================================="
          echo "  PostgreSQL-Specific Tests"
          echo "  (live PostgreSQL service required)"
          echo "=========================================="

          echo ""
          echo "--- Migration tests ---"
          python -m pytest \
            tests/test_revoke_association_migration.py \
            tests/test_media_storage_backend_migration.py \
            tests/test_message_revocations_integrity_migration.py \
            tests/test_message_revocations_tenant_integrity.py \
            tests/test_check_message_revocations_integrity.py \
            -rs -v --tb=short --durations=5

          echo ""
          echo "--- RND-227 revision verification + readiness endpoint (live DB) ---"
          python -m pytest \
            tests/test_verify_alembic_head.py \
            tests/test_readiness_health_endpoint.py \
            -rs -v --tb=short --durations=5

          echo ""
          echo "--- Revoke concurrency test ---"
          python -m pytest \
            tests/test_revoke_concurrency.py \
            -rs -v --tb=short --durations=5

          echo ""
          echo "--- Tenant foundation (live DB) ---"
          python -m pytest \
            tests/test_tenant_foundation.py \
            -rs -v --tb=short

          echo ""
          echo "--- Auth (live DB) ---"
          python -m pytest \
            tests/test_auth.py \
            -k "test_session_cookie_validates_against_db" \
            -rs -v --tb=short

          echo ""
          echo "PostgreSQL tests passed."
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/wecom_test
          RND201_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/postgres
          RND174_TEST_DATABASE_URL: postgresql://test:test@localhost:5432/postgres

  deploy:
    name: Deploy to ECS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    # QA round 2 finding: without this, two workflow runs (e.g. two rapid
    # pushes to main) could both reach this job and SSH in concurrently,
    # racing deploy_server.sh's own PREV_SHA capture / restart / last-
    # known-good bookkeeping against each other. `cancel-in-progress:
    # false` queues a second run rather than cancelling a deploy that's
    # already mid-flight (never kill a deploy partway through). This is
    # the primary serialization guarantee; deploy_server.sh's own flock
    # (docs/DEPLOYMENT.md §7.1) is defense-in-depth for invocations
    # outside GitHub Actions' visibility (e.g. a manual SSH run).
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # QA round 2 fix: the fetch/checkout-to-EXPECTED_SHA step and the
      # invocation of deploy_server.sh are ONE SSH session/script block
      # (not two separate steps) specifically so PREV_SHA, captured
      # before the checkout, stays in the same shell's environment when
      # deploy_server.sh runs — two separate appleboy/ssh-action steps
      # would be two independent SSH connections with no shared shell
      # state between them.
      #
      # Why the checkout happens HERE, in the workflow YAML, rather than
      # solely inside scripts/deploy_server.sh: this workflow file is
      # always evaluated at github.sha itself (GitHub Actions reads
      # `push`-triggered workflows from the commit that triggered them),
      # so this script block is ALWAYS fresh — unlike the copy of
      # deploy_server.sh already sitting on the server from the
      # previous release, which cannot know about logic added in THIS
      # commit until something checks that commit out. Doing the
      # checkout here means the very deploy that ships a change to
      # deploy_server.sh's own logic already runs that new logic,
      # instead of only taking effect starting with the next deploy.
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT }}
          envs: EXPECTED_SHA
          script: |
            set -euo pipefail
            cd /srv/apps/wecom-archive-365/current

            # QA round 3 fix: the lock MUST be acquired before the
            # checkout below, not after (inside deploy_server.sh, as an
            # earlier version of this workflow had it) -- otherwise a
            # concurrent manual deploy already mid-flight (holding this
            # same lock) would still have its working tree silently
            # swapped out from under it by this checkout before this
            # script ever finds out the lock is held. DEPLOY_LOCK_FILE
            # must match scripts/deploy_server.sh's own
            # $DEPLOY_STATE_DIR/deploy.lock exactly.
            DEPLOY_LOCK_FILE=/srv/apps/wecom-archive-365/shared/deploy_state/deploy.lock
            mkdir -p "$(dirname "$DEPLOY_LOCK_FILE")"
            exec 9>"$DEPLOY_LOCK_FILE"
            if ! flock -n 9; then
              echo "ERROR: another deploy is already in progress (lock held on $DEPLOY_LOCK_FILE). Refusing to run concurrently." >&2
              exit 1
            fi

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "ERROR: working tree has uncommitted changes; refusing to checkout." >&2
              exit 1
            fi
            PREV_SHA="$(git rev-parse HEAD)"
            echo "Previous commit: $PREV_SHA"
            git fetch --quiet origin main
            if ! git merge-base --is-ancestor "$PREV_SHA" "$EXPECTED_SHA"; then
              echo "ERROR: EXPECTED_SHA ($EXPECTED_SHA) is not a fast-forward from $PREV_SHA." >&2
              exit 1
            fi
            git checkout -B main "$EXPECTED_SHA"
            echo "Checked out: $(git rev-parse HEAD)"

            # From here on, this IS the freshly-checked-out
            # deploy_server.sh -- fd 9 (and the flock on it, acquired
            # above) is inherited by this child process automatically;
            # DEPLOY_LOCK_ALREADY_HELD=1 tells it not to re-open fd 9
            # itself, which would create a second, distinct open file
            # description and self-deadlock against the lock this
            # script is still holding. PREV_SHA and EXPECTED_SHA are both
            # already in this shell's environment, so the script skips
            # its own (redundant) checkout and uses them directly.
            export PREV_SHA
            export DEPLOY_LOCK_ALREADY_HELD=1
            bash scripts/deploy_server.sh
