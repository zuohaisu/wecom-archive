<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Crowntime WeCom Archive</title>
<link rel="stylesheet" href="styles.css">
<style>
html,body{height:100%;overflow:hidden}
.tile{width:1280px;height:854px;display:flex}
.main{flex:1;background:#1677ff;display:flex;align-items:center;justify-content:center;padding:0 60px}
.main span{color:#fff;font-family:var(--font-sans);font-weight:700;font-size:120px;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.strip{width:25%;display:flex;flex-direction:column}
.strip i{flex:1;display:block}
</style>
</head>
<body>
<div class="tile">
  <div class="main"><span>会话存档</span></div>
  <div class="strip">
    <i style="background:#b7eb8f"></i>
    <i style="background:#ffe58f"></i>
    <i style="background:#237804"></i>
    <i style="background:#cf1322"></i>
  </div>
</div>
</body>
</html>
