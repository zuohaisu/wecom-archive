<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>搜索结果 · 对话审阅控制台 (RND-229 / RND-230 设计预览)</title>
<style>
/* ============================================================
   设计令牌 — 严格复用现有控制台 (backend/app/main.py _REVIEW_CONSOLE_HTML)
   ============================================================ */
:root{
  --primary:#1890ff;
  --primary-hover:#0958d9;
  --primary-soft:#e6f4ff;
  --topbar-bg:#001529;
  --topbar-fg:#fff;
  --topbar-muted:#8ca0b3;
  --topbar-border:#3a4a5a;
  --page-bg:#f0f2f5;
  --col-bg:#fff;
  --border:#e8e8e8;
  --border-soft:#f0f0f0;
  --header-bg:#fafafa;
  --text:#222;
  --text-2:#666;
  --text-3:#888;
  --text-4:#bbb;
  --kw:#e00;              /* 关键词高亮，沿用 .sr-highlight */
  --err:#cf1322;
  --err-bg:#fff2f0;
  --err-border:#ffccc7;
  --ok:#389e0d;
  --radius:6px;
  --shadow-pop:0 4px 16px rgba(0,0,0,.15);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--text);background:var(--page-bg);
  display:flex;flex-direction:column;height:100vh;overflow:hidden;
}

/* ---------- 顶部栏 (与现有控制台一致) ---------- */
.top-bar{height:44px;background:var(--topbar-bg);color:var(--topbar-fg);display:flex;align-items:center;padding:0 1rem;gap:1rem;flex-shrink:0}
.top-bar h1{font-size:.95rem;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.top-bar a{color:var(--topbar-muted);font-size:.82rem;text-decoration:none;white-space:nowrap}
.top-bar a:hover{color:#fff}
.top-bar-user{margin-left:auto;font-size:.8rem;color:var(--topbar-muted);display:flex;align-items:center;gap:.75rem}
.btn-logout{background:transparent;border:1px solid var(--topbar-border);color:var(--topbar-muted);padding:.2rem .65rem;border-radius:3px;cursor:pointer;font-size:.78rem}
.btn-logout:hover{border-color:var(--topbar-muted);color:#fff}

/* 搜索框 — 沿用 RND-159 .search-bar，Enter 进入结果页 */
.search-bar{position:relative;flex:0 1 320px;min-width:0}
.search-bar form{display:flex;align-items:center;position:relative}
.search-bar input{width:100%;padding:.22rem .6rem .22rem 1.7rem;border:1px solid var(--topbar-border);border-radius:4px;background:#0a1a2e;color:#ddd;font-size:.8rem;outline:none;box-sizing:border-box}
.search-bar input:focus{border-color:var(--primary);background:#0d2137}
.search-bar input::placeholder{color:#5c7185}
.search-bar .ico{position:absolute;left:.55rem;color:#5c7185;font-size:.85rem;pointer-events:none}
.search-bar .enter-hint{position:absolute;right:.5rem;font-size:.66rem;color:#5c7185;border:1px solid var(--topbar-border);border-radius:3px;padding:0 .3rem;pointer-events:none}

/* ---------- 结果页主体 ---------- */
.results-page{flex:1;display:flex;flex-direction:column;overflow:hidden}
.results-header{display:flex;align-items:center;gap:1rem;padding:.7rem 1.25rem;background:var(--col-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.back-link{display:inline-flex;align-items:center;gap:.3rem;color:var(--primary);font-size:.82rem;text-decoration:none;white-space:nowrap}
.back-link:hover{color:var(--primary-hover)}
.query-heading{font-size:1.05rem;font-weight:600;display:flex;align-items:baseline;gap:.6rem;min-width:0;flex:1;overflow:hidden}
.query-heading .q{color:var(--primary)}
.query-heading .count{font-size:.8rem;font-weight:400;color:var(--text-3);white-space:nowrap}
.sort-control{display:flex;align-items:center;gap:.4rem;font-size:.78rem;color:var(--text-3);white-space:nowrap}
.sort-control select{border:1px solid var(--border);border-radius:4px;padding:.2rem .4rem;font-size:.78rem;color:var(--text-2);background:#fff}

/* ---------- 筛选栏 (RND-230) ---------- */
.filter-bar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.55rem 1.25rem;background:var(--header-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.filter-triggers{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.filter-trigger{position:relative}
.filter-btn{display:inline-flex;align-items:center;gap:.35rem;background:#fff;border:1px solid var(--border);border-radius:4px;padding:.28rem .6rem;font-size:.8rem;color:var(--text-2);cursor:pointer}
.filter-btn:hover{border-color:var(--primary);color:var(--primary)}
.filter-btn.active{border-color:var(--primary);color:var(--primary);background:var(--primary-soft)}
.filter-btn .badge-n{display:inline-flex;align-items:center;justify-content:center;min-width:1.05rem;height:1.05rem;padding:0 .25rem;background:var(--primary);color:#fff;border-radius:999px;font-size:.66rem;font-weight:600;margin-left:.1rem}
.filter-btn .caret{font-size:.6rem;color:var(--text-4)}

/* 筛选弹出层 */
.filter-pop{position:absolute;top:115%;left:0;min-width:220px;background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-pop);padding:.4rem;z-index:60;display:none}
.filter-pop.open{display:block}
.filter-pop .pop-title{font-size:.72rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.03em;padding:.25rem .4rem}
.filter-pop .opt{display:flex;align-items:center;gap:.5rem;padding:.3rem .4rem;border-radius:4px;font-size:.82rem;cursor:pointer;color:var(--text)}
.filter-pop .opt:hover{background:var(--primary-soft)}
.filter-pop .opt input{accent-color:var(--primary)}
.filter-pop .opt .sub{margin-left:auto;font-size:.7rem;color:var(--text-4)}
.filter-pop .pop-actions{display:flex;justify-content:flex-end;gap:.4rem;margin-top:.3rem;padding-top:.35rem;border-top:1px solid var(--border-soft)}
.filter-pop .pop-ok{background:var(--primary);color:#fff;border:none;border-radius:4px;padding:.22rem .6rem;font-size:.76rem;cursor:pointer}
.filter-pop .pop-clear{background:transparent;border:none;color:var(--text-3);font-size:.76rem;cursor:pointer}
.filter-pop .search-in-pop{width:100%;padding:.28rem .5rem;border:1px solid var(--border);border-radius:4px;font-size:.8rem;margin-bottom:.35rem;outline:none}
.filter-pop .search-in-pop:focus{border-color:var(--primary)}

/* 已生效条件 chips */
.active-chips{display:flex;align-items:center;gap:.4rem;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:.35rem;background:var(--primary-soft);color:var(--primary-hover);border:1px solid #91caff;border-radius:999px;padding:.18rem .55rem;font-size:.76rem;font-weight:500}
.chip .chip-k{color:var(--text-3);font-weight:400}
.chip .chip-x{border:none;background:transparent;color:var(--primary-hover);cursor:pointer;font-size:.85rem;line-height:1;padding:0}
.chip .chip-x:hover{color:var(--err)}
.clear-all{margin-left:.2rem;background:transparent;border:none;color:var(--text-3);font-size:.78rem;cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.clear-all:hover{color:var(--err)}

/* ---------- 结果列表 (RND-229) ---------- */
.results-body{flex:1;overflow-y:auto;padding:1rem 1.25rem 2rem}
.results-list{display:flex;flex-direction:column;gap:.7rem;max-width:920px;margin:0 auto}
.result-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .85rem;cursor:pointer;transition:border-color .15s,box-shadow .15s,background .15s}
.result-card:hover{border-color:var(--primary);box-shadow:var(--shadow-pop);background:#fafcff}
.rc-context{display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.4rem}
.rc-badge{font-size:.68rem;padding:.05rem .35rem;border-radius:2px;font-weight:600;border:1px solid}
.rc-badge.group{background:#e6f7ff;color:#0958d9;border-color:#91caff}
.rc-badge.direct{background:#f6ffed;color:#389e0d;border-color:#b7eb8f}
.rc-conv{font-weight:600;font-size:.86rem;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-sender{font-size:.78rem;color:var(--text-2)}
.rc-sender.staff{color:var(--primary-hover);font-weight:600}
.rc-time{margin-left:auto;font-size:.72rem;color:var(--text-4);white-space:nowrap}
.rc-snippet{font-size:.85rem;color:#444;line-height:1.55;white-space:pre-wrap;word-break:break-word}
.rc-snippet mark{background:transparent;color:var(--kw);font-weight:700}
.rc-foot{display:flex;align-items:center;gap:.5rem;margin-top:.45rem;font-size:.72rem;color:var(--text-3)}
.rc-route{display:inline-flex;align-items:center;gap:.25rem}
.rc-route .arrow{color:var(--text-4)}
.rc-jump{margin-left:auto;color:var(--primary);font-weight:500;opacity:0;transition:opacity .15s}
.result-card:hover .rc-jump{opacity:1}

/* ---------- 状态: 加载 / 空 / 错误 ---------- */
.state{padding:3rem 1rem;text-align:center;color:var(--text-3);font-size:.9rem}
.state .state-ico{font-size:1.6rem;display:block;margin-bottom:.6rem;opacity:.6}
.state-empty .hint{margin-top:.4rem;font-size:.8rem;color:var(--text-4)}
.state-error{color:var(--err);background:var(--err-bg);border:1px solid var(--err-border);border-radius:var(--radius);max-width:420px;margin:2rem auto}
.skeleton{background:#fff;border:1px solid var(--border);border-radius:var(--radius);padding:.7rem .85rem;max-width:920px;margin:0 auto .7rem}
.sk-line{height:.7rem;border-radius:4px;background:linear-gradient(90deg,#eee 25%,#f5f5f5 37%,#eee 63%);background-size:400% 100%;animation:sk 1.3s ease infinite;margin-bottom:.5rem}
.sk-line.short{width:40%}
.sk-line.mid{width:70%}
@keyframes sk{0%{background-position:100% 0}100%{background-position:-100% 0}}

/* ---------- 回到会话定位演示 (RND-229 jump-back) ---------- */
.console-demo{position:fixed;inset:44px 0 0 0;background:var(--page-bg);display:none;flex-direction:column;z-index:80}
.console-demo.show{display:flex}
.cd-bar{display:flex;align-items:center;gap:.75rem;padding:.55rem 1rem;background:var(--col-bg);border-bottom:1px solid var(--border);flex-shrink:0}
.cd-bar .cd-title{font-size:.9rem;font-weight:600}
.cd-bar .cd-sub{font-size:.78rem;color:var(--text-3)}
.cd-back{margin-left:auto;background:var(--primary);color:#fff;border:none;border-radius:4px;padding:.3rem .7rem;font-size:.8rem;cursor:pointer}
.cd-back:hover{background:var(--primary-hover)}
.cd-timeline{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.65rem;max-width:760px;margin:0 auto;width:100%}
.tl-msg{display:flex;flex-direction:column;gap:.12rem}
.tl-row{display:flex;flex-direction:column;gap:.12rem;max-width:100%}
.tl-meta{display:flex;align-items:center;gap:.35rem;flex-wrap:wrap}
.tl-sender{font-size:.78rem;font-weight:600;color:#555}
.tl-sender.staff{color:var(--primary-hover)}
.tl-time{font-size:.72rem;color:var(--text-4)}
.tl-bubble{background:#f0f0f0;border-radius:11px;padding:.35rem .6rem;font-size:.83rem;line-height:1.5;white-space:pre-wrap;word-break:break-word;max-width:580px;border:2px solid transparent;scroll-margin-top:1rem}
.tl-bubble.staff{background:var(--primary-soft);border-left:3px solid var(--primary)}
.tl-bubble mark{background:transparent;color:var(--kw);font-weight:700}
/* 目标消息: 进场闪光 + 持续高亮 */
@keyframes msgFlash{
  0%{box-shadow:0 0 0 0 rgba(24,144,255,.55);border-color:var(--primary);background:#fffbe6}
  35%{box-shadow:0 0 0 8px rgba(24,144,255,0);border-color:var(--primary);background:#e6f4ff}
  100%{box-shadow:0 0 0 0 rgba(24,144,255,0);border-color:var(--primary);background:#e6f4ff}
}
.tl-bubble.target-flash{animation:msgFlash 1.6s ease-out both}
.tl-bubble.target-active{border-color:var(--primary);background:var(--primary-soft)}

/* ---------- 演示控制面板 (仅用于评审，可删除) ---------- */
.demo-panel{position:fixed;right:14px;bottom:14px;z-index:200;background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 6px 24px rgba(0,0,0,.18);padding:.6rem;width:184px;font-size:.74rem}
.demo-panel h4{font-size:.72rem;color:var(--text-3);text-transform:uppercase;letter-spacing:.04em;margin-bottom:.4rem}
.demo-panel button{display:block;width:100%;text-align:left;background:#fafafa;border:1px solid var(--border);border-radius:4px;padding:.3rem .45rem;margin-bottom:.3rem;font-size:.76rem;color:var(--text-2);cursor:pointer}
.demo-panel button:hover{border-color:var(--primary);color:var(--primary)}
.demo-panel .dp-note{color:var(--text-4);font-size:.68rem;line-height:1.4;margin-top:.3rem}
</style>
</head>
<body>

<!-- ===== 顶部栏 ===== -->
<div class="top-bar">
  <h1>对话审阅控制台</h1>
  <div class="search-bar">
    <form id="searchForm" onsubmit="return doTopSearch(event)">
      <span class="ico">🔍</span>
      <input type="text" id="topSearch" placeholder="搜索联系人或聊天内容…" autocomplete="off" value="退款">
      <span class="enter-hint">↵ 结果页</span>
    </form>
  </div>
  <div class="top-bar-user">
    <span>管理员 · 张伟</span>
    <a href="#">消息记录 ↗</a>
    <a href="#">系统诊断 ↗</a>
    <button class="btn-logout">退出登录</button>
  </div>
</div>

<!-- ===== 结果页 ===== -->
<div class="results-page" id="resultsPage">
  <div class="results-header">
    <a class="back-link" href="#" onclick="return false">‹ 返回控制台</a>
    <div class="query-heading">
      <span>“<span class="q" id="qLabel">退款</span>”</span>
      <span class="count" id="resultCount"></span>
    </div>
    <div class="sort-control">
      <label for="sortSel">排序</label>
      <select id="sortSel" onchange="render()">
        <option value="time_desc" selected>时间（新→旧）</option>
        <option value="time_asc">时间（旧→新）</option>
      </select>
    </div>
  </div>

  <!-- 筛选栏 RND-230 -->
  <div class="filter-bar" id="filterBar">
    <div class="filter-triggers">
      <div class="filter-trigger">
        <button class="filter-btn" id="btnDate" onclick="togglePop('popDate')">日期 <span class="caret">▾</span></button>
        <div class="filter-pop" id="popDate">
          <div class="pop-title">按时间范围</div>
          <label class="opt"><input type="radio" name="dateRange" value="all" checked> 全部时间</label>
          <label class="opt"><input type="radio" name="dateRange" value="1d"> 近 24 小时</label>
          <label class="opt"><input type="radio" name="dateRange" value="7d"> 近 7 天</label>
          <label class="opt"><input type="radio" name="dateRange" value="30d"> 近 30 天</label>
          <label class="opt"><input type="radio" name="dateRange" value="90d"> 近 90 天</label>
          <div class="pop-actions">
            <button class="pop-clear" onclick="closePop('popDate')">取消</button>
            <button class="pop-ok" onclick="applyDate()">确定</button>
          </div>
        </div>
      </div>

      <div class="filter-trigger">
        <button class="filter-btn" id="btnUser" onclick="togglePop('popUser')">用户 <span class="caret">▾</span><span class="badge-n" id="nUser" style="display:none">0</span></button>
        <div class="filter-pop" id="popUser">
          <div class="pop-title">对话中的联系人</div>
          <input class="search-in-pop" placeholder="搜索联系人…" oninput="filterOpts('popUser','optUser')">
          <div id="optUser"></div>
          <div class="pop-actions">
            <button class="pop-clear" onclick="clearFilter('user')">清除</button>
            <button class="pop-ok" onclick="closePop('popUser')">完成</button>
          </div>
        </div>
      </div>

      <div class="filter-trigger">
        <button class="filter-btn" id="btnStaff" onclick="togglePop('popStaff')">员工 <span class="caret">▾</span><span class="badge-n" id="nStaff" style="display:none">0</span></button>
        <div class="filter-pop" id="popStaff">
          <div class="pop-title">监控账号（员工）</div>
          <input class="search-in-pop" placeholder="搜索员工…" oninput="filterOpts('popStaff','optStaff')">
          <div id="optStaff"></div>
          <div class="pop-actions">
            <button class="pop-clear" onclick="clearFilter('staff')">清除</button>
            <button class="pop-ok" onclick="closePop('popStaff')">完成</button>
          </div>
        </div>
      </div>

      <div class="filter-trigger">
        <button class="filter-btn" id="btnType" onclick="togglePop('popType')">消息类型 <span class="caret">▾</span><span class="badge-n" id="nType" style="display:none">0</span></button>
        <div class="filter-pop" id="popType">
          <div class="pop-title">消息类型</div>
          <div id="optType"></div>
          <div class="pop-actions">
            <button class="pop-clear" onclick="clearFilter('msgtype')">清除</button>
            <button class="pop-ok" onclick="closePop('popType')">完成</button>
          </div>
        </div>
      </div>
    </div>

    <div class="active-chips" id="activeChips"></div>
    <button class="clear-all" id="clearAll" style="display:none" onclick="clearAll()">清除全部</button>
  </div>

  <div class="results-body" id="resultsBody">
    <div class="results-list" id="resultsList"></div>
    <div class="state state-empty" id="stateEmpty" style="display:none">
      <span class="state-ico">🔍</span>
      <div>没有匹配的聊天内容</div>
      <div class="hint" id="emptyHint">试试调整或清除筛选条件</div>
    </div>
    <div class="state state-error" id="stateError" style="display:none">
      <div>⚠️ 搜索失败，请稍后重试</div>
    </div>
  </div>
</div>

<!-- ===== 回到会话定位演示 (RND-229) ===== -->
<div class="console-demo" id="consoleDemo">
  <div class="cd-bar">
    <span class="cd-title" id="cdConv">会话</span>
    <span class="cd-sub">已定位到目标消息</span>
    <button class="cd-back" onclick="backToResults()">← 返回搜索结果</button>
  </div>
  <div class="cd-timeline" id="cdTimeline"></div>
</div>

<!-- ===== 演示控制面板 (评审用) ===== -->
<div class="demo-panel">
  <h4>设计评审 · 演示控制</h4>
  <button onclick="setDemoState('normal')">正常结果（含筛选）</button>
  <button onclick="setDemoState('loading')">加载中（骨架屏）</button>
  <button onclick="setDemoState('empty')">空结果</button>
  <button onclick="setDemoState('error')">错误状态</button>
  <button onclick="openJumpBack()">预览：点击结果回到会话</button>
  <div class="dp-note">此面板仅供评审，不影响设计本身，可整体删除。</div>
</div>

<script>
/* ============================================================
   示例数据 — 模拟 /api/search/messages 返回（含 RND-230 维度）
   ============================================================ */
const KEYWORD = "退款";
const NOW = Date.now();
const DAY = 86400000;
function ago(d){return NOW - d*DAY;}

const DATA = [
  {id:"m1", conv:"客户群·华东大区", type:"group", staff:"张伟", user:"李娜", sender:"张伟", isStaff:true,
   snippet:"关于昨天的订单，我们已经发起退款退款流程，预计 1-3 个工作日到账。", time:ago(0.2), msgtype:"text"},
  {id:"m2", conv:"客户群·华东大区", type:"group", staff:"张伟", user:"王芳", sender:"李娜", isStaff:false,
   snippet:"好的，那笔退款什么时候能到账？我这边客户在催了。", time:ago(0.3), msgtype:"text"},
  {id:"m3", conv:"李娜（客户）", type:"direct", staff:"张伟", user:"李娜", sender:"李娜", isStaff:false,
   snippet:"麻烦帮忙催一下退款，单号 TK20260718003。", time:ago(1.1), msgtype:"text"},
  {id:"m4", conv:"售后支持群", type:"group", staff:"陈静", user:"赵敏", sender:"陈静", isStaff:true,
   snippet:"已为您提交退款申请，款项将原路退回到支付账户。", time:ago(2.5), msgtype:"text"},
  {id:"m5", conv:"售后支持群", type:"group", staff:"陈静", user:"赵敏", sender:"系统", isStaff:false,
   snippet:"[系统] 退款工单 #88921 已创建。", time:ago(3), msgtype:"system"},
  {id:"m6", conv:"王芳（客户）", type:"direct", staff:"张伟", user:"王芳", sender:"张伟", isStaff:true,
   snippet:"退款已经处理好了，请您查收。", time:ago(6), msgtype:"text"},
  {id:"m7", conv:"客户群·华东大区", type:"group", staff:"张伟", user:"李娜", sender:"李娜", isStaff:false,
   snippet:"上个月那笔退款到现在还没收到，能查下吗？", time:ago(12), msgtype:"text"},
  {id:"m8", conv:"赵敏（客户）", type:"direct", staff:"陈静", user:"赵敏", sender:"赵敏", isStaff:false,
   snippet:"退款金额和订单不一致，差额 20 元。", time:ago(20), msgtype:"text"},
  {id:"m9", conv:"客户群·华东大区", type:"group", staff:"刘洋", user:"孙强", sender:"刘洋", isStaff:true,
   snippet:"本周退款政策更新：超时订单自动退款。", time:ago(40), msgtype:"text"},
  {id:"m10", conv:"孙强（客户）", type:"direct", staff:"刘洋", user:"孙强", sender:"孙强", isStaff:false,
   snippet:"收到退款了，谢谢！", time:ago(75), msgtype:"text"},
  {id:"m11", conv:"售后支持群", type:"group", staff:"陈静", user:"赵敏", sender:"陈静", isStaff:true,
   snippet:"退款退回到微信零钱，注意查收通知。", time:ago(95), msgtype:"text"},
  {id:"m12", conv:"李娜（客户）", type:"direct", staff:"张伟", user:"李娜", sender:"张伟", isStaff:true,
   snippet:"您的退款已提交，预计明天到账。", time:ago(150), msgtype:"text"},
];

/* ============================================================
   筛选状态
   ============================================================ */
const state = { date:"all", users:new Set(), staff:new Set(), types:new Set() };

const DATE_LABELS = {all:"全部时间","1d":"近 24 小时","7d":"近 7 天","30d":"近 30 天","90d":"近 90 天"};
const TYPE_LABELS = {text:"文本",image:"图片",voice:"语音",video:"视频",file:"文件",link:"链接/卡片",system:"系统消息",emotion:"表情",chatrecord:"聊天记录"};

function uniqueVals(key){ return [...new Set(DATA.map(d=>d[key]))]; }
function esc(s){ return (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
function highlight(text){
  if(!KEYWORD) return esc(text);
  const re = new RegExp("("+KEYWORD.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi");
  return esc(text).replace(re,'<mark>$1</mark>');
}
function fmtTime(ms){
  const d=new Date(ms);
  const p=n=>String(n).padStart(2,"0");
  return `${d.getMonth()+1}月${d.getDate()}日 ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- 构建筛选项 ---------- */
function buildOptLists(){
  const users = uniqueVals("user");
  const staff = uniqueVals("staff");
  const types = uniqueVals("msgtype");
  document.getElementById("optUser").innerHTML = users.map(u=>
    `<label class="opt"><input type="checkbox" value="${esc(u)}" onchange="toggleSet('users',this)" ${state.users.has(u)?"checked":""}> ${esc(u)}</label>`).join("");
  document.getElementById("optStaff").innerHTML = staff.map(s=>
    `<label class="opt"><input type="checkbox" value="${esc(s)}" onchange="toggleSet('staff',this)" ${state.staff.has(s)?"checked":""}> ${esc(s)}</label>`).join("");
  document.getElementById("optType").innerHTML = types.map(t=>
    `<label class="opt"><input type="checkbox" value="${esc(t)}" onchange="toggleSet('types',this)" ${state.types.has(t)?"checked":""}> ${esc(TYPE_LABELS[t]||t)}</label>`).join("");
}

/* ---------- 弹出层 ---------- */
function togglePop(id){
  document.querySelectorAll(".filter-pop").forEach(p=>{ if(p.id!==id) p.classList.remove("open"); });
  document.getElementById(id).classList.toggle("open");
}
function closePop(id){ document.getElementById(id).classList.remove("open"); }
document.addEventListener("click",e=>{
  if(!e.target.closest(".filter-trigger")) document.querySelectorAll(".filter-pop").forEach(p=>p.classList.remove("open"));
});
function filterOpts(popId, listId){
  const q = document.querySelector(`#${popId} .search-in-pop`).value.toLowerCase();
  document.querySelectorAll(`#${listId} .opt`).forEach(o=>{
    o.style.display = o.textContent.toLowerCase().includes(q) ? "" : "none";
  });
}

/* ---------- 筛选交互 ---------- */
function toggleSet(key, el){ el.checked ? state[key].add(el.value) : state[key].delete(el.value); refreshFilterUI(); render(); }
function applyDate(){ const v=document.querySelector('input[name="dateRange"]:checked').value; state.date=v; closePop("popDate"); refreshFilterUI(); render(); }
function clearFilter(key){
  if(key==="user") state.users.clear();
  if(key==="staff") state.staff.clear();
  if(key==="msgtype") state.types.clear();
  if(key==="date") state.date="all";
  buildOptLists(); refreshFilterUI(); render();
}
function clearAll(){ state.date="all"; state.users.clear(); state.staff.clear(); state.types.clear();
  document.querySelector('input[name="dateRange"][value="all"]').checked=true;
  buildOptLists(); refreshFilterUI(); render(); }

function refreshFilterUI(){
  document.getElementById("nUser").style.display = state.users.size? "inline-flex":"none";
  document.getElementById("nUser").textContent = state.users.size;
  document.getElementById("nStaff").style.display = state.staff.size? "inline-flex":"none";
  document.getElementById("nStaff").textContent = state.staff.size;
  document.getElementById("nType").style.display = state.types.size? "inline-flex":"none";
  document.getElementById("nType").textContent = state.types.size;
  document.getElementById("btnDate").classList.toggle("active", state.date!=="all");
  document.getElementById("btnUser").classList.toggle("active", state.users.size>0);
  document.getElementById("btnStaff").classList.toggle("active", state.staff.size>0);
  document.getElementById("btnType").classList.toggle("active", state.types.size>0);

  const chips=[];
  if(state.date!=="all") chips.push(chipHTML("日期", DATE_LABELS[state.date], "date", "date"));
  state.users.forEach(u=>chips.push(chipHTML("用户", u, "users", u)));
  state.staff.forEach(s=>chips.push(chipHTML("员工", s, "staff", s)));
  state.types.forEach(t=>chips.push(chipHTML("类型", TYPE_LABELS[t]||t, "types", t)));
  document.getElementById("activeChips").innerHTML = chips.join("");
  document.getElementById("clearAll").style.display = chips.length? "inline-block":"none";
}
function chipHTML(k,v,kind,val){
  const safeVal = esc(String(val));
  return `<span class="chip" data-kind="${esc(kind)}" data-val="${safeVal}"><span class="chip-k">${esc(k)}:</span> ${esc(v)} <button class="chip-x" title="移除" aria-label="移除筛选">×</button></span>`;
}
// 事件委托：移除已生效筛选条件
document.getElementById("activeChips").addEventListener("click",function(e){
  const x=e.target.closest(".chip-x"); if(!x) return;
  const chip=x.closest(".chip"); const kind=chip.dataset.kind, val=chip.dataset.val;
  if(kind==="date"){ state.date="all"; document.querySelector('input[name="dateRange"][value="all"]').checked=true; }
  else if(kind==="users") state.users.delete(val);
  else if(kind==="staff") state.staff.delete(val);
  else if(kind==="types") state.types.delete(val);
  buildOptLists(); refreshFilterUI(); render();
});

/* ---------- 过滤 + 渲染 ---------- */
function filtered(){
  return DATA.filter(d=>{
    if(state.date!=="all"){
      const span = state.date==="1d"?1 : state.date==="7d"?7 : state.date==="30d"?30 : 90;
      if(d.time < NOW - span*DAY) return false;
    }
    if(state.users.size && !state.users.has(d.user)) return false;
    if(state.staff.size && !state.staff.has(d.staff)) return false;
    if(state.types.size && !state.types.has(d.msgtype)) return false;
    return true;
  });
}

function render(){
  const body=document.getElementById("resultsBody");
  const list=document.getElementById("resultsList");
  const empty=document.getElementById("stateEmpty");
  const err=document.getElementById("stateError");
  const demo = window.__demo;
  list.innerHTML=""; empty.style.display="none"; err.style.display="none";

  if(demo==="loading"){ renderSkeleton(); return; }
  if(demo==="error"){ err.style.display="block"; document.getElementById("resultCount").textContent=""; return; }

  let rows = filtered();
  const sort = document.getElementById("sortSel").value;
  rows = rows.sort((a,b)=> sort==="time_asc"? a.time-b.time : b.time-a.time);

  document.getElementById("resultCount").textContent = `共 ${rows.length} 条消息匹配`;
  if(demo==="empty" || rows.length===0){
    empty.style.display="block";
    document.getElementById("emptyHint").textContent = (state.users.size||state.staff.size||state.types.size||state.date!=="all")
      ? "没有符合当前筛选条件的结果，试试放宽或清除筛选。" : "没有找到包含该关键词的聊天内容。";
    document.getElementById("resultCount").textContent = "共 0 条消息匹配";
    return;
  }

  list.innerHTML = rows.map(r=>`
    <div class="result-card" onclick="openJumpBack('${r.id}')">
      <div class="rc-context">
        <span class="rc-badge ${r.type}">${r.type==="group"?"群聊":"单聊"}</span>
        <span class="rc-conv" title="${esc(r.conv)}">${esc(r.conv)}</span>
        <span class="rc-sender ${r.isStaff?'staff':''}">${esc(r.sender)}</span>
        <span class="rc-time">${fmtTime(r.time)}</span>
      </div>
      <div class="rc-snippet">${highlight(r.snippet)}</div>
      <div class="rc-foot">
        <span class="rc-route">员工 <b>${esc(r.staff)}</b> <span class="arrow">·</span> 客户 <b>${esc(r.user)}</b> <span class="arrow">·</span> ${esc(TYPE_LABELS[r.msgtype]||r.msgtype)}</span>
        <span class="rc-jump">查看上下文 ↗</span>
      </div>
    </div>`).join("");
}

function renderSkeleton(){
  document.getElementById("resultCount").textContent="";
  const list=document.getElementById("resultsList");
  list.innerHTML = Array.from({length:5}).map(()=>`
    <div class="skeleton"><div class="sk-line mid"></div><div class="sk-line"></div><div class="sk-line short"></div></div>`).join("");
}

/* ---------- 回到会话定位 (RND-229) ---------- */
function openJumpBack(id){
  const r = DATA.find(d=>d.id===id); if(!r) return;
  document.getElementById("cdConv").textContent = r.conv + " · " + (r.type==="group"?"群聊":"单聊");
  const others = DATA.filter(d=>d.conv===r.conv).sort((a,b)=>a.time-b.time);
  const tl = document.getElementById("cdTimeline");
  tl.innerHTML = others.map(d=>`
    <div class="tl-msg">
      <div class="tl-row">
        <div class="tl-meta">
          <span class="tl-sender ${d.isStaff?'staff':''}">${esc(d.sender)}</span>
          <span class="tl-time">${fmtTime(d.time)}</span>
        </div>
        <div class="tl-bubble ${d.isStaff?'staff':''}" id="bub-${d.id}">${highlight(d.snippet)}</div>
      </div>
    </div>`).join("");
  document.getElementById("consoleDemo").classList.add("show");
  const target = document.getElementById("bub-"+id);
  requestAnimationFrame(()=>{
    target.scrollIntoView({behavior:"smooth", block:"center"});
    target.classList.add("target-flash");
    target.addEventListener("animationend",()=>target.classList.add("target-active"),{once:true});
  });
}
function backToResults(){ document.getElementById("consoleDemo").classList.remove("show"); }

/* ---------- 顶部搜索 Enter -> 结果页 ---------- */
function doTopSearch(e){ e.preventDefault(); const v=document.getElementById("topSearch").value.trim();
  if(v){ document.getElementById("qLabel").textContent=v; } return false; }

/* ---------- 演示状态 ---------- */
function setDemoState(s){ window.__demo=s; render(); }

/* ---------- init ---------- */
buildOptLists();
refreshFilterUI();
render();
</script>
</body>
</html>
