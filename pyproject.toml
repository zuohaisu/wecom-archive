[tool.ruff]
target-version = "py39"

[tool.ruff.lint.isort]
# Without this, ruff's isort treats every `app.*` import as third-party
# (merged into the same group as fastapi/sqlalchemy/etc, no blank line
# separating it) — the opposite of the blank-line-separated grouping this
# codebase already writes by convention everywhere. That mismatch is what
# made I001 ("Import block is un-sorted") fire on files whose imports were
# actually fine, purely because ruff didn't know `app` is this project's
# own package. RND-321 QA-004: confirmed via `ruff check --diff` that two
# RND-321-touched files' only "unsorted" complaint was this exact
# mismatch — not anything newly introduced.
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
# backend/tests/ has an established, repo-wide convention (68 instances
# pre-dating this config, already `# noqa: F401`'d on the import half):
# a pytest fixture (e.g. `db`, `client`) is imported by name into a test
# module purely so pytest can discover it, then used again as an
# identically-named parameter in every test function that needs it. That
# second use is exactly what F811 ("redefined-while-unused") exists to
# catch for a *real* accidental shadowing bug — but here the "redefinition"
# is pytest's own dependency-injection mechanism, not a mistake. Ignoring
# F811 for this directory only (not repo-wide) turns `make lint` from
# noise dominated by one well-understood false-positive category into a
# signal that still flags real issues (unused imports/variables) anywhere,
# including in backend/tests/ itself. No test file's actual code changed
# to produce this — see https://github.com/zuohaisu/wecom-archive/wiki/Media-Storage-Operations and the RND-187
# fix-round notes for context.
"backend/tests/*.py" = ["F811"]

[tool.pytest.ini_options]
markers = [
    "requires_internal_ops_docs: asserts contracts for private production-operations documents omitted from public snapshots; still runs in the full repository suite",
]
